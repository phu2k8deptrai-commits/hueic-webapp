    function getTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().split('T')[0];
    }

    function formatDateVN(isoDate) {
      if (!isoDate) return '—';
      const parts = String(isoDate).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : isoDate;
    }

    function getNowTimeLabel() {
      const now = new Date();
      return now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + formatDateVN(getTodayISO());
    }

    function getVnInitials(fullName) {
      if (!fullName) return 'QT';
      const cleaned = fullName.replace(/^(PGS\.|GS\.|TS\.|ThS\.|Thầy|Cô|GV\.)\s*/gi, '').trim();
      const words = cleaned.split(/\s+/).filter(Boolean);
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[words.length - 2][0] + words[words.length - 1][0]).toUpperCase();
    }

    function isValidScore(v) {
      return v !== '' && v !== null && v !== undefined && !Number.isNaN(Number(v));
    }

    function calcSubjectAvg(g) {
      if (!g) return null;
      const mid = isValidScore(g.midterm) ? g.midterm : g.period;
      if (![g.oral, g.quiz, mid, g.final].every(isValidScore)) return null;
      const val = Number(g.oral) * 0.1 + Number(g.quiz) * 0.2 + Number(mid) * 0.2 + Number(g.final) * 0.5;
      return Math.round(val * 10) / 10;
    }

    function getStoredDb() {
      const saved = localStorage.getItem('sll_local_db');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.users) && Array.isArray(parsed.students)) {
            if (typeof window !== 'undefined' && window.INITIAL_DB && Array.isArray(window.INITIAL_DB.students) && parsed.students.length < window.INITIAL_DB.students.length) {
              try { localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB)); } catch (e) {}
              return window.INITIAL_DB;
            }
            return parsed;
          }
        } catch (e) {}
      }
      if (typeof window !== 'undefined' && window.INITIAL_DB) {
        try {
          localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB));
        } catch (e) {}
        return window.INITIAL_DB;
      }
      try {
        localStorage.setItem('sll_local_db', JSON.stringify(FALLBACK_DB));
      } catch (e) {}
      return FALLBACK_DB;
    }

          4: { name: 'CĐ Cơ khí Ô tô K48A', dept: 'Khoa Cơ khí Chế tạo', teacher: 'Thầy Lê Văn Hùng', phone: '0902000004' },
          5: { name: 'CĐ Thiết kế Đồ họa K48A', dept: 'Khoa Mỹ thuật & Thiết kế', teacher: 'Cô Phan Thị Mai', phone: '0902000005' }
        };

        const targetCls = classMap[adminStudentForm.class_id] || classMap[1];
        const newId = Date.now();
        const newStudent = {
          id: newId,
          student_code: code,
          full_name: name,
          gender: adminStudentForm.gender || 'Nam',
          dob: adminStudentForm.dob || '2006-01-01',
          class_id: Number(adminStudentForm.class_id),
          class_name: targetCls.name,
          major: targetCls.name,
          department: targetCls.dept,
          parent_name: adminStudentForm.parent_name.trim() || 'Phụ huynh ' + name,
          parent_phone: adminStudentForm.parent_phone.trim() || '090300' + String(newId).slice(-4),
          teacher_name: targetCls.teacher,
          teacher_phone: targetCls.phone
        };

        // Tạo 5 điểm mặc định
        const newGrades = [1, 2, 3, 4, 5].map((sub, sIdx) => ({
          id: newId + sIdx,
          student_id: newId,
          semester_id: 1,
          subject: ['Lập trình Web & Mobile', 'Cơ sở dữ liệu nâng cao', 'Kiến trúc máy tính & HĐH', 'Phân tích thiết kế HTTT', 'Tiếng Anh chuyên ngành CNTT'][sIdx] || 'Môn ' + (sIdx + 1),
          oral: 8.0,
          quiz: 8.0,
          period: 8.0,
          midterm: 8.0,
          final: 8.5
        }));

        const newAudit = {
          id: Date.now() + 1,
          action: 'ADD_STUDENT',
          user: 'BGH / Quản trị hệ thống',
          detail: `Thêm sinh viên mới ${name} (${code}) vào lớp ${targetCls.name}`,
          time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' Hôm nay'
        };

        const newAtt = {
          id: newId,
          student_id: newId,
          class_id: Number(adminStudentForm.class_id),
          date: '2026-11-20',
          status: 'PRESENT',
          note: 'Đúng giờ'
        };
        const newFee = {
          id: newId,
          student_id: newId,
          title: 'Học phí Học kỳ I (2026 – 2027)',
          amount: Number(dbData?.tuition?.amount || 5250000),
          status: 'PAID',
          due_date: '2026-11-30'
        };

        const nextStudents = [newStudent, ...(dbData?.students || [])];
        const nextGrades = [...newGrades, ...(dbData?.grades || [])];
        const nextAtt = [newAtt, ...(dbData?.attendance || [])];
        const nextFees = [newFee, ...(dbData?.fees || [])];

        persistDb({
          ...FALLBACK_DB,
          ...dbData,
          students: nextStudents,
          grades: nextGrades,
          attendance: nextAtt,
          fees: nextFees,
          audits: [newAudit, ...(dbData?.audits || [])]
        });

        setShowAddStudent(false);
        showToast('Thêm sinh viên thành công', `Đã thêm sinh viên ${name} (${code}) vào lớp ${targetCls.name}.`, 'success');
      };

      // State cho form thêm giảng viên
      const [showAddTeacher, setShowAddTeacher] = useState(false);
      const [teacherSearch, setTeacherSearch] = useState('');
      const [teacherForm, setTeacherForm] = useState({
        full_name: '',
        department: 'Khoa Công nghệ Thông tin',
        class_name: '',
        email: '',
        phone: ''
      });

      // State cho cấu hình học phí đồng bộ
      const [tuitionInput, setTuitionInput] = useState(() => String(dbData?.tuition?.amount || 2850000));
      const [semesterInput, setSemesterInput] = useState(() => dbData?.tuition?.semester || 'Học kỳ I (2026 – 2027)');

      // State cho thông báo
      const [newAnn, setNewAnn] = useState({ title: '', content: '', tag: 'HỌC VỤ' });
      const [deletingAnnId, setDeletingAnnId] = useState(null);

      const toastTimerRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === 'sll_local_db' && e.newValue) {
            try {
              const parsed = JSON.parse(e.newValue);
              setDbData(parsed);
              if (parsed?.tuition?.amount) setTuitionInput(String(parsed.tuition.amount));
              if (parsed?.tuition?.semester) setSemesterInput(parsed.tuition.semester);
            } catch (err) {}
          }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      const showToast = (title, message, type = 'success') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ title, message, type });
        toastTimerRef.current = setTimeout(() => setToast(null), 3400);
      };

      const currentAdmin = useMemo(() => {
        return dbData?.users?.find(u => u.role === 'ADMIN') || FALLBACK_DB.users[0];
      }, [dbData?.users]);

      const persistWithAudit = (patch, auditAction, auditTarget) => {
        const base = { ...FALLBACK_DB, ...dbData };
        const nextAudits = auditAction
          ? [
              {
                id: Date.now(),
                user: currentAdmin.full_name,
                action: auditAction,
                target: auditTarget,
                time: getNowTimeLabel()
              },
              ...(base.audits || [])
            ].slice(0, 50)
          : (base.audits || []);

        const nextDb = { ...base, ...patch, audits: nextAudits };
        setDbData(nextDb);
        try {
          localStorage.setItem('sll_local_db', JSON.stringify(nextDb));
        } catch (e) {
          showToast('Lỗi lưu trữ', 'Không thể ghi dữ liệu vào bộ nhớ trình duyệt.', 'error');
        }
      };

      const students = useMemo(() => {
        return Array.isArray(dbData?.students) && dbData.students.length > 0
          ? dbData.students
          : FALLBACK_DB.students;
      }, [dbData?.students]);

      const teachers = useMemo(() => {
        const list = (dbData?.users || []).filter(u => u.role === 'TEACHER');
        return list.length > 0 ? list : FALLBACK_DB.users.filter(u => u.role === 'TEACHER');
      }, [dbData?.users]);

      const filteredTeachers = useMemo(() => {
        const kw = teacherSearch.trim().toLowerCase();
        if (!kw) return teachers;
        return teachers.filter(t =>
          (t.full_name || '').toLowerCase().includes(kw) ||
          (t.department || '').toLowerCase().includes(kw) ||
          (t.class_name || '').toLowerCase().includes(kw)
        );
      }, [teachers, teacherSearch]);

      const announcements = useMemo(() => {
        return Array.isArray(dbData?.announcements) ? dbData.announcements : FALLBACK_DB.announcements;
      }, [dbData?.announcements]);

      // Tính toán chỉ số thật cho từng sinh viên từ grades và attendance
      const studentMetrics = useMemo(() => {
        const grades = dbData?.grades || [];
        const attendance = dbData?.attendance || [];
        return students.map(s => {
          const sGrades = grades.filter(g => g.student_id === s.id).map(calcSubjectAvg).filter(v => v !== null);
          const avg = sGrades.length > 0
            ? Math.round((sGrades.reduce((a, b) => a + b, 0) / sGrades.length) * 10) / 10
            : null;

          const sAtt = attendance.filter(a => a.student_id === s.id);
          const presentOrLate = sAtt.filter(a => a.status === 'PRESENT' || a.status === 'LATE').length;
          const attRate = sAtt.length > 0 ? Math.round((presentOrLate / sAtt.length) * 100) : null;

          return { ...s, avg, attRate, attCount: sAtt.length };
        });
      }, [students, dbData?.grades, dbData?.attendance]);

      // Tổng hợp các lớp đang có dữ liệu thật trong hệ thống
      const liveClassStats = useMemo(() => {
        const grouped = {};
        studentMetrics.forEach(s => {
          const clsName = s.class_name || 'CĐ CNTT K48A';
          if (!grouped[clsName]) grouped[clsName] = [];
          grouped[clsName].push(s);
        });
        return Object.entries(grouped).map(([className, members]) => {
          const validAvgs = members.map(m => m.avg).filter(v => v !== null);
          const validRates = members.map(m => m.attRate).filter(v => v !== null);
          const advisor = teachers.find(t => t.class_name === className);
          return {
            className,
            count: members.length,
            advisorName: advisor?.full_name || 'Chưa phân công',
            avgScore: validAvgs.length > 0 ? (validAvgs.reduce((a, b) => a + b, 0) / validAvgs.length).toFixed(1) : '—',
            attRate: validRates.length > 0 ? `${Math.round(validRates.reduce((a, b) => a + b, 0) / validRates.length)}%` : 'Chưa điểm danh'
          };
        });
      }, [studentMetrics, teachers]);

      const pendingLeavesCount = useMemo(() => {
        return (dbData?.leaves || []).filter(l => l.status === 'PENDING').length;
      }, [dbData?.leaves]);

      // Tổng hợp nhật ký thực tế từ DB
      const auditLogs = useMemo(() => {
        const logs = [...(dbData?.audits || [])];

        (dbData?.leaves || []).slice(0, 5).forEach(l => {
          logs.push({
            id: `leave-${l.id}`,
            user: l.student_name,
            action: l.status === 'APPROVED' ? 'ĐƠN NGHỈ PHÉP ĐÃ DUYỆT' : l.status === 'REJECTED' ? 'ĐƠN NGHỈ PHÉP TỪ CHỐI' : 'GỬI ĐƠN NGHỈ PHÉP',
            target: `${l.class_name || 'K48A'} (${formatDateVN(l.start_date)})`,
            time: formatDateVN(l.start_date)
          });
        });

        announcements.slice(0, 3).forEach(a => {
          logs.push({
            id: `ann-${a.id}`,
            user: a.author_name || 'Ban Giám hiệu',
            action: 'PHÁT THÔNG BÁO',
            target: a.title,
            time: formatDateVN(a.created_at)
          });
        });

        if (logs.length === 0) {
          logs.push({
            id: 'init-1',
            user: currentAdmin.full_name,
            action: 'ĐĂNG NHẬP HỆ THỐNG',
            target: 'Cổng Quản trị SchoolPulse',
            time: getNowTimeLabel()
          });
        }
        return logs;
      }, [dbData?.audits, dbData?.leaves, announcements, currentAdmin.full_name]);

      const handleAddTeacher = (e) => {
        e.preventDefault();
        if (!teacherForm.full_name.trim()) {
          showToast('Thiếu thông tin', 'Vui lòng nhập họ và tên giảng viên.', 'error');
          return;
        }
        const newTeacher = {
          id: Date.now(),
          role: 'TEACHER',
          full_name: teacherForm.full_name.trim(),
          department: teacherForm.department,
          class_id: Date.now(),
          class_name: teacherForm.class_name.trim() || 'Giảng dạy chuyên môn',
          email: teacherForm.email.trim() || 'gv@hueic.edu.vn',
          phone: teacherForm.phone.trim() || 'Chưa cập nhật',
          status: 'Đang giảng dạy'
        };

        const currentUsers = Array.isArray(dbData?.users) && dbData.users.length > 0 ? dbData.users : FALLBACK_DB.users;
        persistWithAudit(
          { users: [...currentUsers, newTeacher] },
          'PHÂN CÔNG GIẢNG VIÊN',
          `${newTeacher.full_name} — ${newTeacher.class_name}`
        );

        setTeacherForm({ full_name: '', department: 'Khoa Công nghệ Thông tin', class_name: '', email: '', phone: '' });
        setShowAddTeacher(false);
        showToast('Đã thêm giảng viên', `Phân công thành công ${newTeacher.full_name}.`, 'success');
      };

      const handleSaveTuitionConfig = (e) => {
        e.preventDefault();
        const amount = Number(String(tuitionInput).replace(/[^0-9]/g, ''));
        if (!amount || amount < 100000) {
          showToast('Số tiền không hợp lệ', 'Vui lòng nhập mức học phí hợp lệ (VNĐ).', 'error');
          return;
        }

        persistWithAudit(
          { tuition: { ...(dbData?.tuition || {}), amount, semester: semesterInput.trim() || 'Học kỳ I (2026 – 2027)' } },
          'CẬP NHẬT MỨC HỌC PHÍ',
          `${amount.toLocaleString('vi-VN')} VNĐ (${semesterInput})`
        );
        showToast('Đã cập nhật học phí', 'Mức học phí và mã VietQR trên cổng Sinh viên & Phụ huynh đã tự động đồng bộ.', 'success');
      };

      const handlePostAnnouncement = (e) => {
        e.preventDefault();
        if (!newAnn.title.trim() || !newAnn.content.trim()) {
          showToast('Thiếu thông tin', 'Vui lòng nhập đầy đủ tiêu đề và nội dung thông báo.', 'error');
          return;
        }

        const newPost = {
          id: Date.now(),
          title: newAnn.title.trim(),
          content: newAnn.content.trim(),
          tag: newAnn.tag,
          created_at: getTodayISO(),
          author_name: currentAdmin.full_name,
          read_by: []
        };

        persistWithAudit(
          { announcements: [newPost, ...announcements] },
          'PHÁT THÔNG BÁO TOÀN TRƯỜNG',
          newPost.title
        );
        setNewAnn({ title: '', content: '', tag: 'HỌC VỤ' });
        showToast('Đã phát thông báo', 'Thông báo đã hiển thị trên cổng Phụ huynh và Sinh viên.', 'success');
      };

      const handleDeleteAnnouncement = (id) => {
        const target = announcements.find(a => a.id === id);
        const updated = announcements.filter(a => a.id !== id);
        persistWithAudit(
          { announcements: updated },
          'GỠ THÔNG BÁO',
          target?.title || `ID #${id}`
        );
        setDeletingAnnId(null);
        showToast('Đã gỡ thông báo', 'Thông báo đã được xóa khỏi hệ thống.', 'info');
      };

      const handleExportSchoolReport = () => {
        try {
          const rows = studentMetrics.map((s, idx) => ({
            'STT': idx + 1,
            'Mã SV': s.student_code,
            'Họ và tên': s.full_name,
            'Lớp': s.class_name || 'CĐ CNTT K48A',
            'Giới tính': s.gender || 'Nam',
            'Điểm TB hiện tại': s.avg !== null ? s.avg : 'Chưa đủ điểm',
            'Tỷ lệ chuyên cần': s.attRate !== null ? `${s.attRate}% (${s.attCount} buổi)` : 'Chưa có dữ liệu',
            'Học phí kỳ hiện tại (VNĐ)': Number(dbData?.tuition?.amount || 2850000)
          }));

          const ws = XLSX.utils.json_to_sheet(rows);
          ws['!cols'] = [
            { wch: 5 }, { wch: 13 }, { wch: 24 }, { wch: 16 },
            { wch: 10 }, { wch: 18 }, { wch: 22 }, { wch: 22 }
          ];
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Bao_Cao_SchoolPulse');
          const fileName = `Bao_Cao_Tong_Hop_SchoolPulse_${getTodayISO()}.xlsx`;
          XLSX.writeFile(wb, fileName);

          persistWithAudit({}, 'XUẤT BÁO CÁO EXCEL', `${fileName} (${rows.length} sinh viên)`);
          showToast('Xuất Excel thành công', `Đã tải xuống tệp ${fileName}`, 'success');
        } catch (e) {
          showToast('Lỗi xuất file', e.message, 'error');
        }
      };

      const handleDownloadTemplate = () => {
        const sample = [
          { 'Mã SV': 'HUEIC2606', 'Họ và tên': 'Võ Minh Triết', 'Lớp': 'CĐ CNTT K48A', 'Giới tính': 'Nam', 'Phụ huynh': 'Võ Văn Hùng', 'SĐT Phụ huynh': '0905.112.233' },
          { 'Mã SV': 'HUEIC2607', 'Họ và tên': 'Nguyễn Ngọc Hân', 'Lớp': 'CĐ CNTT K48A', 'Giới tính': 'Nữ', 'Phụ huynh': 'Nguyễn Thị Mai', 'SĐT Phụ huynh': '0914.334.455' }
        ];
        const ws = XLSX.utils.json_to_sheet(sample);
        ws['!cols'] = [{ wch: 13 }, { wch: 22 }, { wch: 16 }, { wch: 10 }, { wch: 20 }, { wch: 16 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Mau_Nhap_SV');
        XLSX.writeFile(wb, 'Mau_Danh_Sach_Sinh_Vien_SchoolPulse.xlsx');
      };

      const handleImportStudentsFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonRows = XLSX.utils.sheet_to_json(firstSheet);

            if (!jsonRows.length) {
              showToast('File trống', 'Không tìm thấy dòng dữ liệu nào trong file Excel.', 'error');
              return;
            }

            const existingCodes = new Set(students.map(s => String(s.student_code).toUpperCase()));
            const added = [];

            jsonRows.forEach((row, idx) => {
              const code = String(row['Mã SV'] || row['student_code'] || row['MSV'] || '').trim();
              const name = String(row['Họ và tên'] || row['full_name'] || row['Họ tên'] || '').trim();
              if (!name) return;
              const finalCode = code || `HUEIC${Date.now().toString().slice(-4)}${idx}`;
              if (existingCodes.has(finalCode.toUpperCase())) return;
              existingCodes.add(finalCode.toUpperCase());

              added.push({
                id: Date.now() + idx,
                student_code: finalCode,
                full_name: name,
                class_id: 1,
                class_name: String(row['Lớp'] || row['class_name'] || 'CĐ CNTT K48A').trim(),
                gender: String(row['Giới tính'] || row['gender'] || 'Nam').trim(),
                parent_name: String(row['Phụ huynh'] || row['parent_name'] || '').trim(),
                parent_phone: String(row['SĐT Phụ huynh'] || row['parent_phone'] || '').trim()
              });
            });

            if (added.length === 0) {
              showToast('Không có sinh viên mới', 'Các mã sinh viên trong file đã tồn tại hoặc thiếu cột "Họ và tên".', 'info');
              return;
            }

            persistWithAudit(
              { students: [...students, ...added] },
              'NHẬP EXCEL SINH VIÊN',
              `Thêm ${added.length} sinh viên từ ${file.name}`
            );
            showToast('Nhập dữ liệu thành công', `Đã thêm ${added.length} sinh viên mới vào hệ thống.`, 'success');
          } catch (err) {
            showToast('Lỗi đọc file Excel', 'File không đúng định dạng .xlsx / .csv.', 'error');
          } finally {
            e.target.value = '';
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const navItems = [
        { id: 'dashboard', label: 'Tổng quan', icon: 'dashboard' },
        { id: 'organization', label: 'Cơ cấu tổ chức HueIC', icon: 'organization' },
        { id: 'teachers', label: `Giảng viên (${teachers.length})`, icon: 'teachers' },
        { id: 'classes', label: 'Khoa & Lớp học', icon: 'classes' },
        { id: 'students', label: `Sinh viên (${(dbData?.students || []).length})`, icon: 'students' },
        { id: 'fees', label: 'Học phí & Tài chính', icon: 'fees' },
        { id: 'announcements', label: `Thông báo (${announcements.length})`, icon: 'announcements' },
        { id: 'excel', label: 'Nhập / Xuất Excel', icon: 'excel' },
        { id: 'audits', label: 'Nhật ký hệ thống', icon: 'audits' }
      ];

      const currentTuitionNum = Number(dbData?.tuition?.amount || 2850000);
      const totalEstimatedFee = 1250 * currentTuitionNum;
      const collectedFee = Math.round(totalEstimatedFee * 0.942);
      const remainingFee = totalEstimatedFee - collectedFee;

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                {!logoBroken ? (
                  <img
                    src="assets/hueic_logo.png"
                    alt="HueIC"
                    onError={() => setLogoBroken(true)}
                    className="w-9 h-9 object-contain rounded-md shrink-0"
                  />
                ) : (
                  <div className="w-9 h-9 rounded-md bg-brand-600 text-white font-bold text-xs flex items-center justify-center shrink-0">
                    SP
                  </div>
                )}
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-sm sm:text-[15px] text-slate-900 truncate">
                      SchoolPulse – Quản trị & Ban Giám hiệu
                    </h1>
                    <span className="hidden md:inline-block bg-blue-50 text-brand-600 text-[11px] font-semibold px-2 py-0.5 rounded border border-blue-100">
                      Điều hành học vụ
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 truncate hidden sm:block">
                    SchoolPulse • Trường Cao đẳng Công nghiệp Huế • Năm học 2026 – 2027
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5 shrink-0">
                <div className="hidden sm:block text-right leading-tight">
                  <div className="text-[13px] font-semibold text-slate-800">{currentAdmin.full_name}</div>
                  <div className="text-[11px] text-slate-500">{currentAdmin.title || 'Hiệu trưởng Nhà trường'}</div>
                </div>
                <div
                  className="w-8 h-8 rounded-full bg-blue-50 text-brand-600 font-bold flex items-center justify-center text-xs border border-blue-200"
                  title={currentAdmin.full_name}
                >
                  {getVnInitials(currentAdmin.full_name)}
                </div>

                            className="w-full px-3 py-2 rounded-lg border border-slate-300 text-[13px] bg-white outline-none focus:border-brand-600"
                          >
                            <option value="HỌC VỤ">Học vụ</option>
                            <option value="KHẨN CẤP">Khẩn cấp</option>
                            <option value="TÀI CHÍNH">Tài chính</option>
                            <option value="THÔNG THƯỜNG">Thông thường</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Nội dung chi tiết</label>
                        <textarea
                          rows="3"
                          value={newAnn.content}
                          onChange={e => setNewAnn(prev => ({ ...prev, content: e.target.value }))}
                          placeholder="Nhập nội dung gửi tới giảng viên, sinh viên và phụ huynh..."
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 text-[13px] outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15"
                          required
                        />
                      </div>

                      <button
                        type="submit"
                        className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs transition shadow-sm cursor-pointer"
                      >
                        Phát thông báo ngay
                      </button>
                    </form>
                  </div>

                  {/* Danh sách thông báo đã đăng */}
                  <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-3">
                    <h3 className="font-semibold text-sm text-slate-900 pb-2 border-b border-slate-100">
                      Thông báo đang hiển thị ({announcements.length})
                    </h3>
                    {announcements.length === 0 ? (
                      <div className="py-6 text-center text-xs text-slate-400">Chưa có thông báo nào.</div>
                    ) : (
                      <div className="space-y-2.5">
                        {announcements.map(ann => (
                          <div key={ann.id} className="p-3.5 rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                            <div className="space-y-1 min-w-0">
                              <div className="flex flex-wrap items-center gap-2">
                                <span className="px-2 py-0.5 rounded bg-blue-50 text-brand-600 border border-blue-100 text-[10px] font-semibold">
                                  {ann.tag || 'HỌC VỤ'}
                                </span>
                                <span className="font-semibold text-sm text-slate-900">{ann.title}</span>
                              </div>
                              <p className="text-xs text-slate-600 leading-relaxed">{ann.content}</p>
                              <div className="text-[11px] text-slate-400">
                                Ngày đăng: {formatDateVN(ann.created_at)} • {(ann.read_by || []).length} phụ huynh đã xác nhận đọc
                              </div>
                            </div>

                            <div className="shrink-0">
                              {deletingAnnId === ann.id ? (
                                <div className="flex items-center gap-1.5 bg-red-50 px-2.5 py-1 rounded-lg border border-red-200 text-xs">
                                  <button
                                    onClick={() => handleDeleteAnnouncement(ann.id)}
                                    className="px-2 py-0.5 bg-red-600 text-white rounded font-semibold cursor-pointer"
                                  >
                                    Xóa
                                  </button>
                                  <button
                                    onClick={() => setDeletingAnnId(null)}
                                    className="text-slate-600 px-1 cursor-pointer"
                                  >
                                    Hủy
                                  </button>
                                </div>
                              ) : (
                                <button
                                  onClick={() => setDeletingAnnId(ann.id)}
                                  className="px-2.5 py-1 rounded-md border border-slate-200 hover:border-red-300 hover:text-red-600 text-xs text-slate-500 font-medium transition cursor-pointer"
                                >
                                  Gỡ bỏ
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* TAB 6: NHẬP / XUẤT EXCEL */}
              {currentTab === 'excel' && (
                <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-4">
                  <div className="pb-3 border-b border-slate-100">
                    <h2 className="text-base font-bold text-slate-900">Nhập & Xuất dữ liệu Excel (.xlsx)</h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Hỗ trợ xuất báo cáo tổng hợp thực tế và nhập nhanh danh sách sinh viên khóa mới bằng SheetJS.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/70 flex flex-col justify-between gap-4">
                      <div>
                        <h3 className="font-semibold text-sm text-slate-900">Xuất báo cáo tổng hợp sinh viên</h3>
                        <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                          Tải bảng tổng hợp {students.length} sinh viên kèm điểm trung bình và tỷ lệ chuyên cần thực tế hiện tại.
                        </p>
                      </div>
                      <button
                        onClick={handleExportSchoolReport}
                        className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-lg shadow-sm transition flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <Icon name="excel" className="w-4 h-4" />
                        <span>Xuất báo cáo (.xlsx)</span>
                      </button>
                    </div>

                    <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/70 flex flex-col justify-between gap-4">
                      <div>
                        <h3 className="font-semibold text-sm text-slate-900">Nhập danh sách sinh viên từ Excel</h3>
                        <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                          Đọc file .xlsx / .csv gồm các cột: Mã SV, Họ và tên, Lớp, Giới tính, Phụ huynh, SĐT Phụ huynh.
                        </p>
                      </div>
                      <div className="flex flex-col sm:flex-row gap-2">
                        <input
                          ref={fileInputRef}
                          type="file"
                          accept=".xlsx,.xls,.csv"
                          onChange={handleImportStudentsFile}
                          className="hidden"
                        />
                        <button
                          onClick={() => fileInputRef.current?.click()}
                          className="flex-1 py-2.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-800 font-semibold text-xs rounded-lg transition flex items-center justify-center gap-1.5 cursor-pointer"
                        >
                          <Icon name="upload" className="w-4 h-4" />
                          <span>Chọn file Excel</span>
                        </button>
                        <button
                          onClick={handleDownloadTemplate}
                          className="px-3 py-2.5 bg-blue-50 hover:bg-blue-100 text-brand-600 font-semibold text-xs rounded-lg transition cursor-pointer"
                        >
                          File mẫu
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 7: NHẬT KÝ HỆ THỐNG */}
              {currentTab === 'audits' && (
                <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-4">
                  <div className="pb-3 border-b border-slate-100 flex items-center justify-between gap-2">
                    <div>
                      <h2 className="text-base font-bold text-slate-900">Nhật ký hoạt động hệ thống</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Ghi nhận các thao tác quản trị, phát thông báo, xuất/nhập dữ liệu và đơn từ trên hệ thống.
                      </p>
                    </div>
                    <span className="text-xs text-slate-500 font-mono">{auditLogs.length} bản ghi</span>
                  </div>

                  <div className="divide-y divide-slate-100 text-[13px]">
                    {auditLogs.map(log => (
                      <div key={log.id} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                        <div>
                          <span className="font-semibold text-slate-900">{log.user}</span>
                          <span className="mx-2 text-slate-300">•</span>
                          <span className="font-medium text-brand-600 text-xs">{log.action}</span>
                          <span className="text-slate-600 text-xs ml-2">({log.target})</span>
                        </div>
                        <span className="text-xs text-slate-400 font-mono tabular-nums shrink-0">{log.time}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Thông báo nổi */}
          {toast && (
            <div
              role="status"
              className={`fixed bottom-5 right-5 z-50 px-4 py-3 bg-white rounded-xl shadow-lg border border-slate-200 border-l-4 max-w-sm ${
                toast.type === 'error'
                  ? 'border-l-red-600'
                  : toast.type === 'info'
                  ? 'border-l-brand-600'
                  : 'border-l-emerald-600'
              }`}
            >
              <div className="text-[13px] font-semibold text-slate-900">{toast.title}</div>
              <p className="text-xs text-slate-500 mt-0.5">{toast.message}</p>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-400 mt-auto">
            © 2026 Trường Cao đẳng Công nghiệp Huế (HueIC) — Cổng Quản trị & Ban Giám hiệu • SchoolPulse
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
