    function getTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split('T')[0];
    }

    function formatDateVN(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : isoDate;
    }

    // Lấy tên viết tắt kiểu Việt Nam (VD: "Nguyễn Hoàng Long" -> "HL", "Thầy Nguyễn Văn An" -> "VA")
    function getVnInitials(fullName) {
      if (!fullName) return 'GV';
      const cleaned = fullName.replace(/^(Thầy|Cô|ThS\.|TS\.|GV\.)\s*/i, '').trim();
      const words = cleaned.split(/\s+/).filter(Boolean);
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[words.length - 2][0] + words[words.length - 1][0]).toUpperCase();
    }

    // Chuẩn hóa tên file khi xuất Excel
    function slugifyFilename(str) {
      return String(str || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .replace(/[^a-zA-Z0-9]+/g, '_')
        .replace(/^_|_$/g, '');
    }

    function calcAverage(g) {
      if (!g) return null;
      const fields = [g.oral, g.quiz, g.midterm, g.final];
      if (fields.some(v => v === '' || v === null || v === undefined || Number.isNaN(Number(v)))) {
        return null;
      }
      const avg = Number(g.oral) * 0.1 + Number(g.quiz) * 0.2 + Number(g.midterm) * 0.2 + Number(g.final) * 0.5;
      return Math.round(avg * 10) / 10;
    }

    function getGradeClassification(avg) {
      if (avg === null) {
        return { label: 'Chưa đủ điểm', short: '—', badge: 'bg-slate-100 text-slate-500 border-slate-200' };
      }
      if (avg >= 8.5) return { label: 'A (Giỏi)', short: 'A', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
      if (avg >= 7.0) return { label: 'B (Khá)', short: 'B', badge: 'bg-blue-50 text-blue-700 border-blue-200' };
      if (avg >= 5.5) return { label: 'C (Trung bình)', short: 'C', badge: 'bg-amber-50 text-amber-700 border-amber-200' };
      if (avg >= 4.0) return { label: 'D (TB yếu)', short: 'D', badge: 'bg-orange-50 text-orange-700 border-orange-200' };
      return { label: 'F (Học lại)', short: 'F', badge: 'bg-red-50 text-red-700 border-red-200' };
    }

    function getStoredDb() {
      const saved = localStorage.getItem('sll_local_db');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.users) && Array.isArray(parsed.students)) {
            if (typeof window !== 'undefined' && window.INITIAL_DB && Array.isArray(window.INITIAL_DB.students) && parsed.students.length < window.INITIAL_DB.students.length) {
              try { localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB)); } catch (e) {}
              return window.INITIAL_DB;
            }
            return parsed;
          }
        } catch (e) {}
      }
      if (typeof window !== 'undefined' && window.INITIAL_DB) {
        try {
          localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB));
        } catch (e) {}
        return window.INITIAL_DB;
      }
      try {
        localStorage.setItem('sll_local_db', JSON.stringify(FALLBACK_DB));
      } catch (e) {}
      return FALLBACK_DB;
    }

        case 'excel':

        case 'save':
          return <svg {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        case 'x':

    function TeacherApp() {
      const [dbData, setDbData] = useState(() => getStoredDb());
      const [currentTab, setCurrentTab] = useState('grades');
      const [selectedSubject, setSelectedSubject] = useState(SUBJECT_LIST[0]);

      const [searchText, setSearchText] = useState('');
      const [leaveFilter, setLeaveFilter] = useState('ALL');
      const [rejectingId, setRejectingId] = useState(null);
      const [logoBroken, setLogoBroken] = useState(false);

      const [gradeInputs, setGradeInputs] = useState({});
      const [gradesDirty, setGradesDirty] = useState(false);
      const [attendanceMap, setAttendanceMap] = useState({});
      const [attendanceDirty, setAttendanceDirty] = useState(false);

      const toastTimerRef = useRef(null);
      const chatBottomRef = useRef(null);

      const currentTeacher = useMemo(() => {
        const storedCode = sessionStorage.getItem('hueic_teacher_code');
        const storedId = sessionStorage.getItem('hueic_teacher_id');
        const teachers = (dbData?.users || FALLBACK_DB.users || []).filter(u => u.role === 'TEACHER');
        let found = null;
        if (storedCode) {
          found = teachers.find(u =>
            String(u.teacher_code || '').toUpperCase() === String(storedCode).toUpperCase() ||
            String(u.alt_code || '').toUpperCase() === String(storedCode).toUpperCase() ||
            String(u.email || '').toLowerCase() === String(storedCode).toLowerCase()
          );
        }
        if (!found && storedId) {
          found = teachers.find(u => String(u.id) === String(storedId));
        }
        return found || teachers[0] || FALLBACK_DB.users[0];
      }, [dbData]);

      const classStudents = useMemo(() => {
        const teacherClassId = currentTeacher.class_id ?? 1;
        const list = (dbData?.students || []).filter(s => s.class_id === teacherClassId);
        return list.length > 0 ? list : FALLBACK_DB.students;
      }, [dbData, currentTeacher]);

      const filteredStudents = useMemo(() => {
        const kw = searchText.trim().toLowerCase();
        if (!kw) return classStudents;
        return classStudents.filter(s =>
          s.full_name.toLowerCase().includes(kw) ||
          (s.student_code || '').toLowerCase().includes(kw)

        full_name: '',
        gender: 'Nam',
        dob: '2006-01-01',
        parent_name: '',

        if (!window.confirm(`Thầy/Cô có chắc chắn muốn xóa sinh viên ${name} (${code}) khỏi hệ thống lớp ${currentTeacher.class_name}? Dữ liệu điểm và chuyên cần của sinh viên này sẽ bị xóa bỏ.`)) {
          return;
        }
        const nextStudents = (dbData?.students || []).filter(s => s.id !== id);
        const nextGrades = (dbData?.grades || []).filter(g => g.student_id !== id);
        const nextAtt = (dbData?.attendance || []).filter(a => a.student_id !== id);
        const nextFees = (dbData?.fees || []).filter(f => f.student_id !== id);

        persistDb({
          ...FALLBACK_DB,
          ...dbData,
          students: nextStudents,
          grades: nextGrades,
          attendance: nextAtt,
          fees: nextFees

      const handleSaveNewStudent = (e) => {
        e.preventDefault();

        }));

          },

            student_id: 1,

      const showToast = (title, message, type = 'success') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ title, message, type });
        toastTimerRef.current = setTimeout(() => setToast(null), 3200);

      const persistDb = (nextDb) => {
        setDbData(nextDb);
        try {

        } catch (e) {
          showToast('Lỗi lưu trữ', 'Bộ nhớ trình duyệt không ghi được dữ liệu.', 'error');
        }
      };

      // Đồng bộ dữ liệu khi có tab khác cập nhật
      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === 'sll_local_db' && e.newValue) {
            try { setDbData(JSON.parse(e.newValue)); } catch (err) {}
          }
          if (e.key === 'sll_parent_chat' && e.newValue) {
            try { setTeacherChat(JSON.parse(e.newValue)); } catch (err) {}
          }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      // Nạp bảng điểm của môn đang chọn
      useEffect(() => {
        const nextMap = {};
        classStudents.forEach(s => {
          const g = (dbData?.grades || []).find(
            item => item.student_id === s.id && (item.subject === selectedSubject || item.subject_name === selectedSubject)
          );
          const midVal = g?.midterm ?? g?.period;
          nextMap[s.id] = {
            oral: g?.oral !== undefined && g?.oral !== null ? String(g.oral) : '',
            quiz: g?.quiz !== undefined && g?.quiz !== null ? String(g.quiz) : '',
            midterm: midVal !== undefined && midVal !== null ? String(midVal) : '',
            final: g?.final !== undefined && g?.final !== null ? String(g.final) : ''
          };
        });
        setGradeInputs(nextMap);
        setGradesDirty(false);
      }, [dbData?.grades, selectedSubject, classStudents]);

      // Nạp điểm danh theo đúng ngày & môn đang chọn
      useEffect(() => {
        const records = dbData?.attendance || [];
        const approvedLeaves = (dbData?.leaves || []).filter(l => l.status === 'APPROVED');
        const nextMap = {};

        classStudents.forEach(s => {
          const exact = records.find(
            a => a.student_id === s.id && a.date === attendanceDate && a.subject === selectedSubject
          );
          if (exact) {
            nextMap[s.id] = exact.status;
            return;
          }
          const excusedByLeave = approvedLeaves.some(
            l => l.student_id === s.id && attendanceDate >= l.start_date && attendanceDate <= (l.end_date || l.start_date)
          );
          nextMap[s.id] = excusedByLeave ? 'EXCUSED' : 'PRESENT';
        });

        setAttendanceMap(nextMap);
        setAttendanceDirty(false);
      }, [dbData?.attendance, dbData?.leaves, attendanceDate, selectedSubject, classStudents]);

      // Tự cuộn khung chat xuống tin mới nhất
      useEffect(() => {
        if (currentTab === 'messages') {
          chatBottomRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [teacherChat, currentTab, selectedChatStudentId]);

      // Thống kê nhanh của môn đang nhập điểm
      const gradeSummary = useMemo(() => {
        const avgs = classStudents.map(s => calcAverage(gradeInputs[s.id])).filter(v => v !== null);
        if (avgs.length === 0) return { entered: 0, mean: '—', passRate: '—' };
        const sum = avgs.reduce((a, b) => a + b, 0);
        const passed = avgs.filter(v => v >= 4.0).length;
        return {
          entered: avgs.length,
          mean: (sum / avgs.length).toFixed(1),
          passRate: `${Math.round((passed / avgs.length) * 100)}%`
        };
      }, [classStudents, gradeInputs]);

      // Thống kê nhanh điểm danh buổi đang chọn
      const attendanceSummary = useMemo(() => {
        const counts = { PRESENT: 0, EXCUSED: 0, UNEXCUSED: 0, LATE: 0 };
        classStudents.forEach(s => {
          const st = attendanceMap[s.id] || 'PRESENT';
          if (counts[st] !== undefined) counts[st]++;
        });
        return counts;
      }, [classStudents, attendanceMap]);

      const pendingLeavesCount = useMemo(() => {
        return (dbData?.leaves || []).filter(l => l.status === 'PENDING').length;
      }, [dbData?.leaves]);

      const visibleLeaves = useMemo(() => {
        const list = dbData?.leaves || [];
        if (leaveFilter === 'PENDING') return list.filter(l => l.status === 'PENDING');
        if (leaveFilter === 'DONE') return list.filter(l => l.status !== 'PENDING');
        return list;
      }, [dbData?.leaves, leaveFilter]);

      const visibleMessages = useMemo(() => {
        if (!activeChatStudent) return teacherChat;
        const defaultStudentId = classStudents[0]?.id;
        return teacherChat.filter(m => (m.student_id || defaultStudentId) === activeChatStudent.id);
      }, [teacherChat, activeChatStudent, classStudents]);

      const handleGradeChange = (studentId, field, rawVal) => {
        if (rawVal === '') {
          setGradeInputs(prev => ({
            ...prev,
            [studentId]: { ...prev[studentId], [field]: '' }
          }));
          setGradesDirty(true);
          return;
        }
        const num = Number(rawVal);
        if (Number.isNaN(num)) return;
        const clamped = num > 10 ? '10' : num < 0 ? '0' : rawVal;
        setGradeInputs(prev => ({
          ...prev,
          [studentId]: { ...prev[studentId], [field]: clamped }
        }));
        setGradesDirty(true);
      };

      const handleSaveGrades = () => {
        const updatedGrades = [...(dbData?.grades || [])];
        classStudents.forEach(s => {
          const g = gradeInputs[s.id] || {};
          const hasAnyValue = [g.oral, g.quiz, g.midterm, g.final].some(v => v !== '' && v !== undefined);
          const idx = updatedGrades.findIndex(
            item => item.student_id === s.id && (item.subject === selectedSubject || item.subject_name === selectedSubject)
          );

          if (!hasAnyValue && idx < 0) return;

          const toNumOrNull = (val) => (val === '' || val === undefined ? null : Math.min(10, Math.max(0, parseFloat(val))));
          const mid = toNumOrNull(g.midterm);
          const record = {
            id: idx >= 0 ? updatedGrades[idx].id : Date.now() + s.id,
            student_id: s.id,
            student_name: s.full_name,
            semester_id: 1,
            subject: selectedSubject,
            oral: toNumOrNull(g.oral),
            quiz: toNumOrNull(g.quiz),
            period: mid,
            midterm: mid,
            final: toNumOrNull(g.final)
          };
          if (idx >= 0) updatedGrades[idx] = record;
          else updatedGrades.push(record);
        });

        persistDb({ ...FALLBACK_DB, ...dbData, grades: updatedGrades });
        setGradesDirty(false);
        showToast('Đã lưu bảng điểm', `Cập nhật xong điểm môn ${selectedSubject}.`, 'success');
      };

      const handleToggleAttendance = (studentId, status) => {
        setAttendanceMap(prev => ({ ...prev, [studentId]: status }));
        setAttendanceDirty(true);
      };

      const handleMarkAllPresent = () => {
        const map = {};
        classStudents.forEach(s => { map[s.id] = 'PRESENT'; });
        setAttendanceMap(map);
        setAttendanceDirty(true);
      };

      const handleSaveAttendance = () => {
        const newRecords = classStudents.map((s, i) => ({
          id: Date.now() + i,
          student_id: s.id,
          student_name: s.full_name,
          date: attendanceDate,
          status: attendanceMap[s.id] || 'PRESENT',
          subject: selectedSubject,
          recorded_by: currentTeacher.full_name
        }));

        const otherRecords = (dbData?.attendance || []).filter(
          a => !(a.date === attendanceDate && a.subject === selectedSubject)
        );
        persistDb({ ...FALLBACK_DB, ...dbData, attendance: [...newRecords, ...otherRecords] });
        setAttendanceDirty(false);
        showToast('Đã lưu sổ điểm danh', `Ghi nhận điểm danh ngày ${formatDateVN(attendanceDate)} (${selectedSubject}).`, 'success');
      };

      // Hỗ trợ Ctrl+S khi đang nhập điểm hoặc điểm danh
      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            if (currentTab === 'grades') {
              e.preventDefault();
              handleSaveGrades();
            } else if (currentTab === 'attendance') {
              e.preventDefault();
              handleSaveAttendance();
            }
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [currentTab, gradeInputs, attendanceMap, selectedSubject, attendanceDate, classStudents, dbData]);

      const handleApproveLeave = (leaveId, isApproved) => {
        let targetLeave = null;
        const updatedLeaves = (dbData?.leaves || []).map(l => {
          if (l.id === leaveId) {
            targetLeave = { ...l, status: isApproved ? 'APPROVED' : 'REJECTED', reviewed_at: getTodayISO() };
            return targetLeave;
          }
          return l;
        });

        let updatedAtt = [...(dbData?.attendance || [])];
        if (isApproved && targetLeave) {
          const exists = updatedAtt.some(
            a => a.student_id === targetLeave.student_id && a.date === targetLeave.start_date && a.subject === selectedSubject
          );
          if (!exists) {
            updatedAtt.unshift({
              id: Date.now(),
              student_id: targetLeave.student_id,
              student_name: targetLeave.student_name,
              date: targetLeave.start_date,
              subject: selectedSubject,
              status: 'EXCUSED',
              note: `Nghỉ có phép: ${targetLeave.reason}`,
              recorded_by: currentTeacher.full_name
            });
          }
        }

        persistDb({ ...FALLBACK_DB, ...dbData, leaves: updatedLeaves, attendance: updatedAtt });
        setRejectingId(null);
        showToast(
          isApproved ? 'Đã duyệt đơn nghỉ phép' : 'Đã từ chối đơn',
          isApproved ? 'Chuyên cần của sinh viên đã tự động ghi nhận "Có phép".' : 'Đã cập nhật trạng thái từ chối.',
          isApproved ? 'success' : 'info'
        );
      };

      const handleExportGradesExcel = () => {
        try {
          const rows = classStudents.map((s, idx) => {
            const g = gradeInputs[s.id] || {};
            const avg = calcAverage(g);
            const cls = getGradeClassification(avg);
            return {
              'STT': idx + 1,
              'Mã SV': s.student_code,
              'Họ và tên': s.full_name,
              'Lớp': currentTeacher.class_name,
              'Môn học': selectedSubject,
              'TX (10%)': g.oral !== '' ? Number(g.oral) : '',
              'TH (20%)': g.quiz !== '' ? Number(g.quiz) : '',
              'GK (20%)': g.midterm !== '' ? Number(g.midterm) : '',
              'CK (50%)': g.final !== '' ? Number(g.final) : '',
              'Điểm TB': avg !== null ? avg : '',
              'Xếp loại': cls.label
            };
          });

          const ws = XLSX.utils.json_to_sheet(rows);
          ws['!cols'] = [
            { wch: 5 }, { wch: 13 }, { wch: 24 }, { wch: 15 }, { wch: 24 },
            { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 16 }
          ];
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Bang_Diem');
          const fileName = `Bang_Diem_${slugifyFilename(selectedSubject)}_${slugifyFilename(currentTeacher.class_name)}.xlsx`;
          XLSX.writeFile(wb, fileName);
          showToast('Xuất Excel thành công', `Đã tải xuống tệp ${fileName}`, 'success');
        } catch (e) {
          showToast('Lỗi xuất file', 'Không thể tạo file Excel: ' + e.message, 'error');
        }
      };

      const handleExportAttendanceExcel = () => {
        try {
          const allRecords = (dbData?.attendance || []).filter(a => !a.subject || a.subject === selectedSubject);
          const rows = classStudents.map((s, idx) => {
            const stuRecs = allRecords.filter(a => a.student_id === s.id);
            const present = stuRecs.filter(a => a.status === 'PRESENT').length;
            const excused = stuRecs.filter(a => a.status === 'EXCUSED').length;
            const unexcused = stuRecs.filter(a => a.status === 'UNEXCUSED').length;
            const late = stuRecs.filter(a => a.status === 'LATE').length;
            const total = stuRecs.length;
            const rate = total > 0 ? `${Math.round(((present + late) / total) * 100)}%` : 'Chưa có dữ liệu';

            return {
              'STT': idx + 1,
              'Mã SV': s.student_code,
              'Họ và tên': s.full_name,
              'Lớp': currentTeacher.class_name,
              'Môn học': selectedSubject,
              'Số buổi ghi nhận': total,
              'Có mặt': present,
              'Đi trễ': late,
              'Vắng có phép': excused,
              'Vắng không phép': unexcused,
              'Tỷ lệ chuyên cần': rate
            };
          });

          const ws = XLSX.utils.json_to_sheet(rows);
          ws['!cols'] = [
            { wch: 5 }, { wch: 13 }, { wch: 24 }, { wch: 15 }, { wch: 24 },
            { wch: 16 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 16 }, { wch: 18 }
          ];
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Chuyen_Can');
          const fileName = `Chuyen_Can_${slugifyFilename(selectedSubject)}_${slugifyFilename(currentTeacher.class_name)}.xlsx`;
          XLSX.writeFile(wb, fileName);
          showToast('Xuất báo cáo thành công', `Đã tải xuống tệp ${fileName}`, 'success');
        } catch (e) {
          showToast('Lỗi xuất file', 'Không thể tạo báo cáo chuyên cần: ' + e.message, 'error');
        }
      };

      const handleSendReply = (e) => {
        e.preventDefault();
        const content = replyInput.trim();
        if (!content || !activeChatStudent) return;

        const nowTime = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' Hôm nay';
        const newMsg = {
          id: Date.now(),
          student_id: activeChatStudent.id,
          sender: 'teacher',
          text: content,
          time: nowTime
        };

        const updated = [...teacherChat, newMsg];
        setTeacherChat(updated);
        try {
          localStorage.setItem('sll_parent_chat', JSON.stringify(updated));
        } catch (err) {}
        setReplyInput('');
      };

      const navItems = [
        { id: 'grades', label: 'Bảng điểm', icon: 'grades' },
        { id: 'attendance', label: 'Điểm danh', icon: 'attendance' },
        { id: 'leaves', label: 'Đơn nghỉ phép', icon: 'leaves', badge: pendingLeavesCount > 0 ? pendingLeavesCount : null },
        { id: 'messages', label: 'Nhắn phụ huynh', icon: 'messages' },
        { id: 'students', label: `Lớp (${classStudents.length})`, icon: 'students' },
        { id: 'excel', label: 'Xuất báo cáo', icon: 'excel' }
      ];

      const teacherDisplayName = currentTeacher.full_name?.startsWith('Thầy') || currentTeacher.full_name?.startsWith('Cô')
        ? currentTeacher.full_name
        : `GV. ${currentTeacher.full_name}`;

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-15 py-2.5 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                {!logoBroken ? (
                  <img
                    src="assets/hueic_logo.png"
                    alt="HueIC"
                    onError={() => setLogoBroken(true)}
                    className="w-9 h-9 object-contain rounded-md shrink-0"
                  />
                ) : (
                  <div className="w-9 h-9 rounded-md bg-brand-600 text-white font-bold text-xs flex items-center justify-center shrink-0">
                    SP
                  </div>
                )}
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-sm sm:text-[15px] text-slate-900 truncate">
                      SchoolPulse – Cổng Giảng viên
                    </h1>
                    <span className="hidden md:inline-block bg-blue-50 text-brand-600 text-[11px] font-semibold px-2 py-0.5 rounded border border-blue-100">
                      CVHT • {currentTeacher.class_name}
                    </span>
                    <span className="bg-emerald-50 text-emerald-700 text-[11px] font-mono font-bold px-2 py-0.5 rounded border border-emerald-200" title="Mã định danh bảo mật của giảng viên">
                      Mã GV: {currentTeacher.teacher_code || 'GV01'}
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 truncate hidden sm:block">
                    SchoolPulse • Trường Cao đẳng Công nghiệp Huế • {currentTeacher.department || 'Khoa Công nghệ Thông tin'}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5 shrink-0">
                <div className="hidden sm:block text-right leading-tight">
                  <div className="text-[13px] font-semibold text-slate-800">{teacherDisplayName}</div>
                  <div className="text-[11px] text-slate-500">Học kỳ I • 2026–2027</div>
                </div>
                <div
                  className="w-8 h-8 rounded-full bg-blue-50 text-brand-600 font-bold flex items-center justify-center text-xs border border-blue-200"
                  title={teacherDisplayName}
                >
                  {getVnInitials(currentTeacher.full_name)}
                </div>
                <button
                  onClick={() => {
                    if (window.HueIC && window.HueIC.logout) {
                      window.HueIC.logout();
                    } else {
                      sessionStorage.clear();
                      window.location.href = 'index.html';
                    }
                  }}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-red-50 hover:border-red-200 text-slate-600 hover:text-red-600 text-xs font-medium transition flex items-center gap-1.5 cursor-pointer"
                  title="Đăng xuất khỏi hệ thống"
                >
                  <Icon name="logout" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Đăng xuất</span>
                </button>
              </div>
            </div>

            {/* Menu ngang cho màn hình nhỏ */}
            <div className="lg:hidden border-t border-slate-100 overflow-x-auto custom-scroll">
              <div className="flex px-3 py-1.5 gap-1 min-w-max">
                {navItems.map(tab => {
                  const active = currentTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setCurrentTab(tab.id)}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition cursor-pointer ${
                        active ? 'bg-blue-50 text-brand-600 font-semibold' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name={tab.icon} className="w-3.5 h-3.5" />
                      <span>{tab.label}</span>
                      {tab.badge && (
                        <span className="bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-full leading-none font-bold">
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {/* Khung nội dung chính */}
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            {/* Sidebar (Desktop) */}
            <aside className="hidden lg:block lg:col-span-3 space-y-4 sticky top-20">
              <div className="bg-white rounded-xl border border-slate-200/90 p-3 shadow-sm">
                <div className="px-2.5 pt-1 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                  Nghiệp vụ giảng dạy
                </div>
                <nav className="space-y-1">
                  {navItems.map(tab => {
                    const active = currentTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setCurrentTab(tab.id)}
                        className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-[13px] transition text-left cursor-pointer ${
                          active
                            ? 'bg-blue-50 text-brand-600 font-semibold'
                            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium'
                        }`}
                      >
                        <span className="flex items-center gap-2.5">
                          <Icon name={tab.icon} className={`w-4 h-4 ${active ? 'text-brand-600' : 'text-slate-400'}`} />
                          <span>{tab.label}</span>
                        </span>
                        {tab.badge && (
                          <span className="bg-orange-100 text-orange-700 border border-orange-200 text-[11px] px-1.5 py-0.5 rounded-md font-semibold leading-none">
                            {tab.badge}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </nav>
              </div>

              {/* Bộ chọn học phần dùng chung */}
              <div className="bg-white rounded-xl border border-slate-200/90 p-4 shadow-sm space-y-2.5">
                <label htmlFor="subject-select" className="block text-xs font-semibold text-slate-700">
                  Học phần đang làm việc
                </label>
                <select
                  id="subject-select"
                  value={selectedSubject}
                  onChange={e => setSelectedSubject(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-[13px] font-medium text-slate-800 outline-none focus:bg-white focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15"
                >
                  {SUBJECT_LIST.map(sub => (
                    <option key={sub} value={sub}>{sub}</option>
                  ))}
                </select>
                <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                  <span>Lớp phụ trách</span>
                  <span className="font-semibold text-slate-700">{currentTeacher.class_name}</span>
                </div>
                <div className="flex items-center justify-between text-xs text-slate-500">
                  <span>Sĩ số hiện tại</span>
                  <span className="font-semibold text-slate-700">{classStudents.length} sinh viên</span>
                </div>
              </div>
            </aside>

            {/* Khu vực làm việc chính */}
            <main className="lg:col-span-9 space-y-4">
              {/* Chọn môn nhanh trên mobile */}
              <div className="lg:hidden bg-white rounded-xl border border-slate-200 p-3 flex items-center gap-3">
                <label className="text-xs font-semibold text-slate-600 shrink-0">Học phần:</label>
                <select
                  value={selectedSubject}
                  onChange={e => setSelectedSubject(e.target.value)}
                  className="flex-1 px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-medium text-slate-800 outline-none focus:border-brand-600"
                >
                  {SUBJECT_LIST.map(sub => (
                    <option key={sub} value={sub}>{sub}</option>
                  ))}
                </select>
              </div>

              {/* TAB 1: BẢNG ĐIỂM */}
              {currentTab === 'grades' && (
                <div className="bg-white rounded-xl border border-slate-200/90 shadow-sm overflow-hidden">
                  <div className="p-4 sm:p-5 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <div className="flex flex-wrap items-center gap-2">
                        <h2 className="text-base font-bold text-slate-900">Sổ điểm học phần</h2>
                        <span className="px-2 py-0.5 rounded bg-blue-50 text-brand-600 text-xs font-semibold border border-blue-100">
                          {selectedSubject}

                          setShowAddStudentModal(true);
                        }}
                        className="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer shrink-0 shadow-2xs"
                      >
                        <Icon name="plus" className="w-3.5 h-3.5" />
                        <span>Thêm sinh viên</span>
                      </button>

                      {/* Modal Thêm sinh viên (Giáo viên) */}
                      {showAddStudentModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
                          <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden">
                            <div className="p-4 sm:p-5 bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-slate-200 flex items-center justify-between">
                              <div className="flex items-center gap-2.5">
                                <div className="w-9 h-9 rounded-xl bg-brand-600 text-white flex items-center justify-center shadow-xs">
                                  <Icon name="plus" className="w-5 h-5" />
                                </div>
                                <div>
                                  <h3 className="font-bold text-sm sm:text-base text-slate-900">Thêm sinh viên vào lớp</h3>
                                  <p className="text-xs text-slate-500">Lớp: {currentTeacher.class_name} • CVHT: {currentTeacher.full_name}</p>
                                </div>
                              </div>
                              <button
                                type="button"
                                onClick={() => setShowAddStudentModal(false)}
                                className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 transition cursor-pointer"
                              >
                                <Icon name="x" className="w-5 h-5" />
                              </button>
                            </div>

                            <form onSubmit={handleSaveNewStudent} className="p-5 space-y-4 text-xs">
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                <div>
                                  <label className="block font-semibold text-slate-700 mb-1">Mã sinh viên <span className="text-rose-500">*</span></label>
                                  <input
                                    type="text"
                                    value={studentForm.student_code}
                                    onChange={e => setStudentForm(prev => ({ ...prev, student_code: e.target.value.toUpperCase() }))}
                                    placeholder="VD: HUEIC26101"
                                    required
                                    className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-800 font-mono font-semibold outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600 uppercase"
                                  />
                                </div>

                                <div>
                                  <label className="block font-semibold text-slate-700 mb-1">Giới tính</label>
                                  <select
                                    value={studentForm.gender}
                                    onChange={e => setStudentForm(prev => ({ ...prev, gender: e.target.value }))}
                                    className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-800 outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600"
                                  >
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                  </select>
                                </div>

                                <div className="sm:col-span-2">
                                  <label className="block font-semibold text-slate-700 mb-1">Họ và tên sinh viên <span className="text-rose-500">*</span></label>
                                  <input
                                    type="text"
                                    value={studentForm.full_name}
                                    onChange={e => setStudentForm(prev => ({ ...prev, full_name: e.target.value }))}
                                    placeholder="Ví dụ: Trần Văn Nam"
                                    required
                                    className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-800 outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600"
                                  />
                                </div>

                                <div>
                                  <label className="block font-semibold text-slate-700 mb-1">Ngày sinh</label>
                                  <input
                                    type="date"
                                    value={studentForm.dob}
                                    onChange={e => setStudentForm(prev => ({ ...prev, dob: e.target.value }))}
                                    className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-800 outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600"
                                  />
                                </div>

                                <div>
                                  <label className="block font-semibold text-slate-700 mb-1">Số ĐT Phụ huynh</label>
                                  <input
                                    type="text"
                                    value={studentForm.parent_phone}
                                    onChange={e => setStudentForm(prev => ({ ...prev, parent_phone: e.target.value }))}
                                    placeholder="Ví dụ: 0903123456"
                                    className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-800 outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600 font-mono"
                                  />
                                </div>

                                <div className="sm:col-span-2">
                                  <label className="block font-semibold text-slate-700 mb-1">Họ tên Phụ huynh</label>
                                  <input
                                    type="text"
                                    value={studentForm.parent_name}
                                    onChange={e => setStudentForm(prev => ({ ...prev, parent_name: e.target.value }))}
                                    placeholder="Ví dụ: Trần Văn Long"
                                    className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-800 outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600"
                                  />
                                </div>
                              </div>

                              <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2.5">
                                <button
                                  type="button"
                                  onClick={() => setShowAddStudentModal(false)}
                                  className="px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium rounded-lg transition cursor-pointer"
                                >
                                  Hủy bỏ
                                </button>
                                <button
                                  type="submit"
                                  className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow-sm transition flex items-center gap-1.5 cursor-pointer"
                                >
                                  <Icon name="check" className="w-4 h-4" />
                                  <span>Lưu sinh viên</span>
                                </button>
                              </div>
                            </form>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="overflow-x-auto custom-scroll">
                    <table className="w-full text-[13px] text-left">
                      <thead className="bg-slate-50 text-slate-500 text-xs font-semibold border-b border-slate-200">
                        <tr>
                          <th className="py-3 px-4 w-10 text-center">#</th>
                          <th className="py-3 px-3">Mã SV</th>
                          <th className="py-3 px-3">Họ và tên</th>
                          <th className="py-3 px-3">Giới tính</th>
                          <th className="py-3 px-3">Phụ huynh / Liên hệ</th>
                          <th className="py-3 px-4 text-right">Thao tác</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredStudents.map((s, idx) => (
                          <tr key={s.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="py-3 px-4 text-center text-xs text-slate-400 tabular-nums">{idx + 1}</td>
                            <td className="py-3 px-3 font-mono text-xs text-slate-600 tabular-nums">{s.student_code}</td>
                            <td className="py-3 px-3">
                              <div className="flex items-center gap-2.5">
                                <div className="w-7 h-7 rounded-full bg-blue-50 text-brand-600 font-bold text-[11px] flex items-center justify-center border border-blue-100 shrink-0">
                                  {getVnInitials(s.full_name)}
                                </div>
                                <span className="font-medium text-slate-900">{s.full_name}</span>
                              </div>
                            </td>
                            <td className="py-3 px-3 text-slate-600">{s.gender || 'Nam'}</td>
                            <td className="py-3 px-3">
                              <div className="text-slate-700">{s.parent_name || 'Chưa cập nhật'}</div>
                              <div className="text-xs text-slate-400 tabular-nums">{s.parent_phone || '—'}</div>
                            </td>
                            <td className="py-3 px-4 text-right">
                              <button
                                onClick={() => {
                                  setSelectedChatStudentId(s.id);
                                  setCurrentTab('messages');
                                }}
                                className="px-2.5 py-1 rounded-md border border-slate-200 hover:border-brand-600 hover:text-brand-600 text-xs font-medium text-slate-600 transition cursor-pointer"
                              >
                                Nhắn PH
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 6: XUẤT BÁO CÁO EXCEL */}
              {currentTab === 'excel' && (
                <div className="bg-white rounded-xl border border-slate-200/90 shadow-sm p-4 sm:p-5 space-y-4">
                  <div className="pb-3.5 border-b border-slate-200">
                    <h2 className="text-base font-bold text-slate-900">Xuất báo cáo học vụ (.xlsx)</h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Tải file bảng tính tổng hợp theo học phần <strong className="text-slate-700">{selectedSubject}</strong> để nộp Phòng Đào tạo.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/70 flex flex-col justify-between gap-4">
                      <div>
                        <h3 className="font-semibold text-sm text-slate-900">Bảng điểm tổng kết học phần</h3>
                        <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                          Gồm đầy đủ mã sinh viên, điểm thành phần (TX, TH, GK, CK), điểm trung bình và xếp loại chữ A–F.
                        </p>
                      </div>
                      <button
                        onClick={handleExportGradesExcel}
                        className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-lg shadow-sm transition flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <Icon name="excel" className="w-4 h-4" />
                        <span>Tải bảng điểm (.xlsx)</span>
                      </button>
                    </div>

                    <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/70 flex flex-col justify-between gap-4">
                      <div>
                        <h3 className="font-semibold text-sm text-slate-900">Báo cáo chuyên cần lớp {currentTeacher.class_name}</h3>
                        <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                          Tổng hợp số buổi có mặt, đi trễ, vắng có phép, vắng không phép và tỷ lệ chuyên cần của từng sinh viên.
                        </p>
                      </div>
                      <button
                        onClick={handleExportAttendanceExcel}
                        className="w-full py-2.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-800 font-semibold text-xs rounded-lg transition flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <Icon name="excel" className="w-4 h-4" />
                        <span>Tải báo cáo chuyên cần (.xlsx)</span>
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Thông báo nổi */}
          {toast && (
            <div
              role="status"
              className={`fixed bottom-5 right-5 z-50 px-4 py-3 bg-white rounded-xl shadow-lg border border-slate-200 border-l-4 max-w-sm ${
                toast.type === 'error'
                  ? 'border-l-red-600'
                  : toast.type === 'info'
                  ? 'border-l-brand-600'
                  : 'border-l-emerald-600'
              }`}
            >
              <div className="text-[13px] font-semibold text-slate-900">{toast.title}</div>
              <p className="text-xs text-slate-500 mt-0.5">{toast.message}</p>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-400 mt-auto">
            © 2026 Trường Cao đẳng Công nghiệp Huế (HueIC) — Cổng thông tin Giảng viên & Cố vấn học tập • SchoolPulse
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TeacherApp />);
  </script>
</body>
</html>
