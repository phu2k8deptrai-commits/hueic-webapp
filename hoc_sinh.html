    function getTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().split('T')[0];
    }

    function formatDateVN(isoDate) {
      if (!isoDate) return '—';
      const parts = String(isoDate).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : isoDate;
    }

    function getTodayLabelVN() {
      const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      return `${days[d.getDay()]}, ${dd}/${mm}`;
    }

    function getVnInitials(fullName) {
      if (!fullName) return 'SV';
      const cleaned = fullName.replace(/^(Thầy|Cô|ThS\.|TS\.|GV\.)\s*/i, '').trim();
      const words = cleaned.split(/\s+/).filter(Boolean);
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[words.length - 2][0] + words[words.length - 1][0]).toUpperCase();
    }

    function isValidScore(v) {
      return v !== '' && v !== null && v !== undefined && !Number.isNaN(Number(v));
    }

    function formatScore(v) {
      return isValidScore(v) ? Number(v).toFixed(1) : '—';
    }

    function calcSubjectAvg(g) {
      if (!g) return null;
      const mid = isValidScore(g.midterm) ? g.midterm : g.period;
      if (![g.oral, g.quiz, mid, g.final].every(isValidScore)) return null;
      const val = Number(g.oral) * 0.1 + Number(g.quiz) * 0.2 + Number(mid) * 0.2 + Number(g.final) * 0.5;
      return Math.round(val * 10) / 10;
    }

    function getRankInfo(avg) {
      if (avg === null || Number.isNaN(avg)) {
        return { letter: '—', name: 'Chưa xếp loại', passed: null, badge: 'bg-slate-100 text-slate-500 border-slate-200' };
      }
      if (avg >= 8.5) return { letter: 'A', name: 'Giỏi', passed: true, badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
      if (avg >= 7.0) return { letter: 'B', name: 'Khá', passed: true, badge: 'bg-blue-50 text-blue-700 border-blue-200' };
      if (avg >= 5.5) return { letter: 'C', name: 'Trung bình', passed: true, badge: 'bg-amber-50 text-amber-700 border-amber-200' };
      if (avg >= 4.0) return { letter: 'D', name: 'TB yếu', passed: true, badge: 'bg-orange-50 text-orange-700 border-orange-200' };
      return { letter: 'F', name: 'Kém', passed: false, badge: 'bg-red-50 text-red-700 border-red-200' };
    }

    function getStoredDb() {
      const saved = localStorage.getItem('sll_local_db');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.students)) {
            if (typeof window !== 'undefined' && window.INITIAL_DB && Array.isArray(window.INITIAL_DB.students) && parsed.students.length < window.INITIAL_DB.students.length) {
              try { localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB)); } catch (e) {}
              return window.INITIAL_DB;
            }
            return parsed;
          }
        } catch (e) {}
      }
      if (typeof window !== 'undefined' && window.INITIAL_DB) {
        try {
          localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB));
        } catch (e) {}
        return window.INITIAL_DB;
      }
      try {
        localStorage.setItem('sll_local_db', JSON.stringify(FALLBACK_DB));
      } catch (e) {}
      return FALLBACK_DB;
    }

        return sessionStorage.getItem('hueic_student_code') || '';
      });
      const [selectedStudentId, setSelectedStudentId] = useState(() => {
        return sessionStorage.getItem('current_student_id') || '';
      });

      // Modal đổi sinh viên / đổi lớp
      const [isSwitchModalOpen, setIsSwitchModalOpen] = useState(false);
      const [modalClassFilter, setModalClassFilter] = useState('ALL');
      const [modalSearchTerm, setModalSearchTerm] = useState('');

      const [toast, setToast] = useState(null);
      const toastTimerRef = useRef(null);
      const chatBottomRef = useRef(null);

      // Đồng bộ realtime khi cổng giảng viên cập nhật localStorage
      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === 'sll_local_db' && e.newValue) {
            try { setDbData(JSON.parse(e.newValue)); } catch (err) {}
          }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      const showToast = (title, message, type = 'success') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ title, message, type });
        toastTimerRef.current = setTimeout(() => setToast(null), 3200);
      };

      const persistDb = (nextDb) => {
        setDbData(nextDb);
        try {
          localStorage.setItem('sll_local_db', JSON.stringify(nextDb));
        } catch (e) {
          showToast('Lỗi lưu dữ liệu', 'Không thể ghi vào bộ nhớ trình duyệt.', 'error');
        }
      };

      // Danh sách toàn bộ sinh viên
      const allStudents = useMemo(() => {
        return Array.isArray(dbData?.students) && dbData.students.length > 0
          ? dbData.students
          : FALLBACK_DB.students;
      }, [dbData?.students]);

      // Sinh viên hiện tại đọc từ sessionStorage
      const currentStudent = useMemo(() => {
        if (selectedStudentCode) {
          const found = allStudents.find(s => s.student_code && s.student_code.toUpperCase() === selectedStudentCode.toUpperCase());
          if (found) return found;
        }
        if (selectedStudentId) {
          const found = allStudents.find(s => String(s.id) === String(selectedStudentId));
          if (found) return found;
        }
        return allStudents[0] || FALLBACK_DB.students[0];
      }, [allStudents, selectedStudentCode, selectedStudentId]);

      // Đồng bộ vào sessionStorage khi currentStudent xác định
      useEffect(() => {
        if (currentStudent) {
          sessionStorage.setItem('hueic_student_code', currentStudent.student_code);
          sessionStorage.setItem('current_student_id', currentStudent.id);
          sessionStorage.setItem('hueic_role', 'STUDENT');
        }
      }, [currentStudent]);

      // Cố vấn học tập (CVHT) phụ trách chính xác theo lớp của sinh viên
      const classAdvisor = useMemo(() => {
        if (currentStudent.teacher_name) {
          const foundTeacher = (dbData?.users || []).find(u =>
            u.role === 'TEACHER' && (
              (u.full_name && currentStudent.teacher_name.includes(u.full_name.replace(/^(Thầy|Cô|GVCN)\s*/i, ''))) ||
              (currentStudent.teacher_phone && u.phone === currentStudent.teacher_phone)
            )
          );
          if (foundTeacher) {
            return {
              ...foundTeacher,
              full_name: currentStudent.teacher_name,
              phone: currentStudent.teacher_phone || foundTeacher.phone || '0902.000.001',
              email: currentStudent.teacher_email || foundTeacher.email || 'daotao@hueic.edu.vn',
              department: currentStudent.department || foundTeacher.department || 'Ban Cố vấn Học tập',
              class_name: currentStudent.class_name
            };
          }
          return {
            id: currentStudent.class_id,
            role: 'TEACHER',
            full_name: currentStudent.teacher_name,
            phone: currentStudent.teacher_phone || '0902.000.001',
            email: currentStudent.teacher_email || 'daotao@hueic.edu.vn',
            department: currentStudent.department || 'Ban Cố vấn Học tập',
            class_name: currentStudent.class_name
          };
        }

        const matchedClass = (dbData?.classes || []).find(c => c.id === currentStudent.class_id);
        if (matchedClass) {
          return {
            id: matchedClass.id,
            role: 'TEACHER',
            full_name: matchedClass.teacher_name,
            phone: matchedClass.teacher_phone,
            email: matchedClass.teacher_email,
            department: matchedClass.department,
            class_name: matchedClass.name
          };
        }
        return dbData?.users?.find(u => u.role === 'TEACHER') || FALLBACK_DB.users[0];
      }, [dbData, currentStudent]);

      const studentClassName = currentStudent.class_name || classAdvisor.class_name || 'CĐ CNTT K48A';

      // Chuyển sinh viên
      const handleSwitchStudent = (st) => {
        setSelectedStudentCode(st.student_code);
        setSelectedStudentId(st.id);
        sessionStorage.setItem('hueic_student_code', st.student_code);
        sessionStorage.setItem('current_student_id', st.id);
        sessionStorage.setItem('hueic_role', 'STUDENT');
        setIsSwitchModalOpen(false);
        showToast('Đã đổi sinh viên thành công', `Đang xem cổng thông tin của ${st.full_name} (${st.student_code} • ${st.class_name}).`, 'success');
      };

      const studentGrades = useMemo(() => {
        const list = (dbData?.grades || []).filter(g => g.student_id === currentStudent.id);
        return list.length > 0 ? list : FALLBACK_DB.grades;
      }, [dbData?.grades, currentStudent.id]);

      const overallStats = useMemo(() => {
        const validAvgs = studentGrades.map(calcSubjectAvg).filter(v => v !== null);
        if (validAvgs.length === 0) {
          return { avg: null, rank: getRankInfo(null), completed: 0 };
        }
        const mean = Math.round((validAvgs.reduce((a, b) => a + b, 0) / validAvgs.length) * 10) / 10;
        return { avg: mean, rank: getRankInfo(mean), completed: validAvgs.length };
      }, [studentGrades]);

      const studentAttendance = useMemo(() => {
        const list = (dbData?.attendance || []).filter(a => a.student_id === currentStudent.id);
        const source = list.length > 0 ? list : FALLBACK_DB.attendance;
        return [...source].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
      }, [dbData?.attendance, currentStudent.id]);

      const attendanceStats = useMemo(() => {
        const counts = { PRESENT: 0, EXCUSED: 0, UNEXCUSED: 0, LATE: 0 };
        studentAttendance.forEach(a => {
          if (counts[a.status] !== undefined) counts[a.status]++;
        });
        const total = studentAttendance.length;
        const rate = total > 0 ? Math.round(((counts.PRESENT + counts.LATE) / total) * 100) : 100;
        return { ...counts, total, rate };
      }, [studentAttendance]);

      const studentLeaves = useMemo(() => {
        return (dbData?.leaves || []).filter(l => l.student_id === currentStudent.id);
      }, [dbData?.leaves, currentStudent.id]);

      const leaveStats = useMemo(() => ({
        total: studentLeaves.length,
        approved: studentLeaves.filter(l => l.status === 'APPROVED').length,
        pending: studentLeaves.filter(l => l.status === 'PENDING').length
      }), [studentLeaves]);

      // Form đơn nghỉ phép
      const [leaveForm, setLeaveForm] = useState(() => ({
        startDate: getTodayISO(),
        endDate: getTodayISO(),
        reason: ''
      }));

      const handleLeaveSubmit = (e) => {
        e.preventDefault();
        if (!leaveForm.reason.trim()) {
          showToast('Thiếu thông tin', 'Vui lòng ghi rõ lý do xin nghỉ phép.', 'error');
          return;
        }
        if (leaveForm.endDate < leaveForm.startDate) {
          showToast('Ngày không hợp lệ', 'Ngày kết thúc không thể trước ngày bắt đầu.', 'error');
          return;
        }

        const newLeave = {
          id: Date.now(),
          student_id: currentStudent.id,
          student_name: currentStudent.full_name,
          class_name: studentClassName,
          start_date: leaveForm.startDate,
          end_date: leaveForm.endDate,
          reason: leaveForm.reason.trim(),
          status: 'PENDING',
          created_at: new Date().toISOString()
        };

        persistDb({
          ...FALLBACK_DB,
          ...dbData,
          leaves: [newLeave, ...(dbData?.leaves || [])]
        });

        setLeaveForm({ startDate: getTodayISO(), endDate: getTodayISO(), reason: '' });
        showToast('Đã gửi đơn nghỉ phép', 'Đơn đã chuyển tới cố vấn học tập chờ phê duyệt.', 'success');
      };

      const handleCancelLeave = (leaveId) => {
        const updated = (dbData?.leaves || []).filter(l => l.id !== leaveId);
        persistDb({ ...FALLBACK_DB, ...dbData, leaves: updated });
        showToast('Đã rút đơn', 'Đơn xin nghỉ phép đang chờ duyệt đã được hủy.', 'info');
      };

      // Tài liệu & Flashcard
      const [activeModuleIdx, setActiveModuleIdx] = useState(0);
      const [cardIdx, setCardIdx] = useState(0);
      const [cardFlipped, setCardFlipped] = useState(false);

      const activeModule = LECTURE_MODULES[activeModuleIdx];
      const activeCard = activeModule.cards[cardIdx] || activeModule.cards[0];

      const handleSelectModule = (idx) => {
        setActiveModuleIdx(idx);
        setCardIdx(0);
        setCardFlipped(false);
      };

      // Trắc nghiệm
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);

      const answeredCount = Object.keys(quizAnswers).length;
      const quizCorrectCount = useMemo(() => {
        return QUIZ_BANK.filter(q => quizAnswers[q.id] === q.answer).length;
      }, [quizAnswers]);

      const handleQuizSubmit = () => {
        if (answeredCount < QUIZ_BANK.length) {
          showToast('Chưa hoàn thành hết câu hỏi', `Bạn mới chọn ${answeredCount}/${QUIZ_BANK.length} câu, hệ thống vẫn chấm bài hiện tại.`, 'info');
        } else {
          showToast('Đã nộp bài luyện tập', `Bạn trả lời đúng ${quizCorrectCount}/${QUIZ_BANK.length} câu.`, 'success');
        }
        setQuizSubmitted(true);
      };

      // Hỏi đáp học vụ (trả lời theo dữ liệu thật)
      const firstName = currentStudent.full_name.trim().split(/\s+/).slice(-1)[0] || 'bạn';
      const [chatMessages, setChatMessages] = useState(() => [
        {
          id: 1,
          sender: 'bot',
          text: `Chào ${firstName}, bạn cần tra cứu nhanh điểm học phần, chuyên cần, đơn nghỉ phép hay thông tin học phí?`
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);

      useEffect(() => {
        if (currentTab === 'assistant') {
          chatBottomRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, isTyping, currentTab]);

      const buildDynamicReply = (rawQuestion) => {
        const q = rawQuestion.toLowerCase();
        if (q.includes('điểm') || q.includes('kết quả') || q.includes('xếp loại')) {
          if (overallStats.avg === null) {
            return 'Hiện các học phần của bạn chưa có đủ điểm thành phần để tính trung bình học kỳ.';
          }
          const topSub = [...studentGrades]
            .map(g => ({ name: g.subject || g.subject_name, avg: calcSubjectAvg(g) }))
            .filter(x => x.avg !== null)
            .sort((a, b) => b.avg - a.avg)[0];
          return `Điểm trung bình hiện tại của bạn là ${overallStats.avg.toFixed(1)} (xếp loại ${overallStats.rank.name}, đã đủ điểm ${overallStats.completed}/${studentGrades.length} môn).${topSub ? ` Môn cao nhất là ${topSub.name} (${topSub.avg.toFixed(1)}).` : ''}`;
        }
        if (q.includes('chuyên cần') || q.includes('vắng') || q.includes('điểm danh')) {
          return `Tỷ lệ chuyên cần của bạn là ${attendanceStats.rate}% trên tổng số ${attendanceStats.total} buổi đã ghi nhận (${attendanceStats.PRESENT} có mặt, ${attendanceStats.LATE} đi trễ, ${attendanceStats.EXCUSED} có phép, ${attendanceStats.UNEXCUSED} không phép).`;
        }
        if (q.includes('nghỉ phép') || q.includes('đơn')) {
          if (leaveStats.total === 0) {
            return 'Bạn chưa gửi đơn xin nghỉ phép nào trong học kỳ này. Bạn có thể vào mục "Đơn nghỉ phép" để tạo đơn mới.';
          }
          return `Bạn đã gửi ${leaveStats.total} đơn nghỉ phép: ${leaveStats.approved} đơn đã duyệt, ${leaveStats.pending} đơn đang chờ cố vấn học tập xử lý.`;
        }
        if (q.includes('học phí') || q.includes('tiền') || q.includes('qr')) {
          const fee = Number(dbData?.tuition?.amount || 2850000).toLocaleString('vi-VN');
          return `Học phí kỳ hiện tại là ${fee} VNĐ. Bạn mở mục "Học phí & VietQR" để lấy mã QR hoặc sao chép nội dung chuyển khoản chuẩn.`;
        }
        if (q.includes('lịch') || q.includes('phòng') || q.includes('cố vấn')) {
          return `Hôm nay có tiết thực hành Lập trình Web & Mobile tại Phòng Lab A204. Cố vấn học tập lớp ${studentClassName} là ${classAdvisor.full_name} (SĐT: ${classAdvisor.phone || '0902.000.001'}).`;
        }
        return 'Mình hỗ trợ tra cứu nhanh: điểm học kỳ, chuyên cần, trạng thái đơn nghỉ phép, lịch phòng máy và học phí. Bạn có thể bấm một gợi ý bên dưới để hỏi nhanh.';
      };

      const sendChatQuestion = (text) => {
        const clean = text.trim();
        if (!clean || isTyping) return;
        setChatMessages(prev => [...prev, { id: Date.now(), sender: 'user', text: clean }]);
        setChatInput('');
        setIsTyping(true);
        setTimeout(() => {
          const reply = buildDynamicReply(clean);
          setChatMessages(prev => [...prev, { id: Date.now() + 1, sender: 'bot', text: reply }]);
          setIsTyping(false);
        }, 350);
      };

      const handleCopyTransferInfo = (text) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => {
            showToast('Đã sao chép', `Nội dung "${text}" đã lưu vào bộ nhớ tạm.`, 'success');
          }).catch(() => {
            showToast('Nội dung chuyển khoản', text, 'info');
          });
        } else {
          showToast('Nội dung chuyển khoản', text, 'info');
        }
      };

      const navItems = [
        { id: 'dashboard', label: 'Tổng quan', icon: 'dashboard' },
        { id: 'grades', label: `Bảng điểm (${studentGrades.length})`, icon: 'grades' },
        { id: 'attendance', label: 'Chuyên cần', icon: 'attendance' },
        { id: 'schedule', label: 'Lịch học cả năm', icon: 'schedule' },
        { id: 'leaves', label: 'Đơn nghỉ phép', icon: 'leaves', badge: leaveStats.pending > 0 ? leaveStats.pending : null },
        { id: 'fees', label: 'Học phí & VietQR', icon: 'fees' },
        { id: 'lectures', label: 'Tài liệu & Flashcard', icon: 'lectures' },
        { id: 'assessment', label: 'Luyện trắc nghiệm', icon: 'assessment' },
        { id: 'assistant', label: 'Hỏi đáp học vụ', icon: 'assistant' }
      ];

      const advisorDisplayName = classAdvisor.full_name?.startsWith('Thầy') || classAdvisor.full_name?.startsWith('Cô')
        ? classAdvisor.full_name
        : `GV. ${classAdvisor.full_name}`;

      const studentFees = useMemo(() => {
        return (dbData?.fees || []).filter(f => f.student_id === currentStudent.id);
      }, [dbData?.fees, currentStudent.id]);

      const tuitionAmount = useMemo(() => {
        const unpaidFee = studentFees.find(f => f.status === 'UNPAID');
        if (unpaidFee) return Number(unpaidFee.amount);
        if (studentFees.length > 0) return Number(studentFees[0].amount);
        return Number(dbData?.tuition?.amount || 2850000);
      }, [studentFees, dbData?.tuition]);

      const transferNote = `HP ${currentStudent.student_code} ${currentStudent.full_name}`;

      // Điểm rèn luyện (thang điểm 100, phản ánh trung thực chuyên cần & nề nếp)
      const conductInfo = useMemo(() => {
        const attRate = attendanceStats.rate || 100;
        const attPart = Math.round((attRate / 100) * 20);
        const avgScore = overallStats.avg || 7.5;
        const gradePart = Math.min(10, Math.round(avgScore));
        const base = 62 + ((currentStudent.id * 7) % 7);
        const total = Math.min(97, Math.max(76, base + attPart + gradePart - 10));
        let rank = 'Tốt';
        let badge = 'bg-blue-50 text-blue-700 border-blue-200';
        if (total >= 90) { rank = 'Xuất sắc'; badge = 'bg-purple-50 text-purple-700 border-purple-200'; }
        else if (total >= 80) { rank = 'Tốt'; badge = 'bg-emerald-50 text-emerald-700 border-emerald-200'; }
        else if (total >= 65) { rank = 'Khá'; badge = 'bg-amber-50 text-amber-700 border-amber-200'; }
        else { rank = 'Trung bình'; badge = 'bg-orange-50 text-orange-700 border-orange-200'; }
        return { score: total, rank, badge };
      }, [attendanceStats.rate, overallStats.avg, currentStudent.id]);

      // Phòng học và lịch thực hành theo chuyên ngành
      const departmentLabMap = {
        'Khoa Công nghệ Thông tin': ['Phòng Lab A204', 'Phòng Lab B102'],
        'Khoa Điện – Điện tử': ['Xưởng TH Điện E301', 'Phòng Khí Cụ Điện E202'],
        'Khoa Cơ khí Chế tạo': ['Xưởng Động Cơ Ô tô C105', 'Xưởng Khung Gầm C106'],
        'Khoa Mỹ thuật & Thiết kế': ['Multimedia Studio D401', 'Phòng Đồ Họa D402']
      };
      const currentLabs = departmentLabMap[currentStudent.department] || ['Phòng Chuyên đề A204', 'Phòng Thực hành B102'];
      const firstSubjectName = studentGrades[0]?.subject || 'Thực hành chuyên ngành 1';
      const secondSubjectName = studentGrades[1]?.subject || 'Lý thuyết chuyên sâu 2';

      // Lọc danh sách sinh viên cho Modal đổi sinh viên
      const filteredStudentsForModal = useMemo(() => {
        return allStudents.filter(s => {
          const matchClass = modalClassFilter === 'ALL' || String(s.class_id) === String(modalClassFilter) || s.class_name === modalClassFilter;
          const term = modalSearchTerm.trim().toLowerCase();
          const matchSearch = !term || (s.full_name && s.full_name.toLowerCase().includes(term)) || (s.student_code && s.student_code.toLowerCase().includes(term));
          return matchClass && matchSearch;
        });
      }, [allStudents, modalClassFilter, modalSearchTerm]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                {!logoBroken ? (
                  <img
                    src="assets/hueic_logo.png"
                    alt="HueIC"
                    onError={() => setLogoBroken(true)}
                    className="w-9 h-9 object-contain rounded-md shrink-0"
                  />
                ) : (
                  <div className="w-9 h-9 rounded-md bg-brand-600 text-white font-bold text-xs flex items-center justify-center shrink-0">
                    SP
                  </div>
                )}
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-sm sm:text-[15px] text-slate-900 truncate">
                      SchoolPulse – Cổng Sinh viên
                    </h1>
                    <span className="hidden md:inline-block bg-blue-50 text-brand-600 text-[11px] font-semibold px-2 py-0.5 rounded border border-blue-100">
                      {studentClassName}
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 truncate hidden sm:block">
                    SchoolPulse • Trường Cao đẳng Công nghiệp Huế • Sổ liên lạc &amp; Học vụ trực tuyến
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5 shrink-0">
                

                <div className="hidden sm:block text-right leading-tight">
                  <div className="text-[13px] font-semibold text-slate-800">{currentStudent.full_name}</div>
                  <div className="text-[11px] text-slate-500 font-mono">{currentStudent.student_code}</div>
                </div>
                <div
                  className="w-8 h-8 rounded-full bg-blue-50 text-brand-600 font-bold flex items-center justify-center text-xs border border-blue-200"
                  title={`${currentStudent.full_name} (${currentStudent.student_code})`}
                >
                  {getVnInitials(currentStudent.full_name)}
                </div>
                <button
                  onClick={() => {
                    if (window.HueIC && window.HueIC.logout) {
                      window.HueIC.logout();
                    } else {
                      sessionStorage.clear();
                      window.location.href = 'index.html';
                    }
                  }}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-red-50 hover:border-red-200 text-slate-600 hover:text-red-600 text-xs font-medium transition flex items-center gap-1.5 cursor-pointer"
                  title="Đăng xuất khỏi hệ thống"
                >
                  <Icon name="logout" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Đăng xuất</span>
                </button>
              </div>
            </div>

            {/* Menu ngang cho màn hình nhỏ */}
            <div className="lg:hidden border-t border-slate-100 overflow-x-auto custom-scroll">
              <div className="flex px-3 py-1.5 gap-1 min-w-max">
                {navItems.map(tab => {
                  const active = currentTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setCurrentTab(tab.id)}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition cursor-pointer ${
                        active ? 'bg-blue-50 text-brand-600 font-semibold' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name={tab.icon} className="w-3.5 h-3.5" />
                      <span>{tab.label}</span>
                      {tab.badge && (
                        <span className="bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-full leading-none font-bold">
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <span className={`px-2.5 py-0.5 rounded-md text-xs font-semibold border ${
                                l.status === 'APPROVED'
                                  ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                  : l.status === 'REJECTED'
                                  ? 'bg-red-50 text-red-700 border-red-200'
                                  : 'bg-amber-50 text-amber-700 border-amber-200'
                              }`}>
                                {l.status === 'APPROVED' ? 'Đã duyệt' : l.status === 'REJECTED' ? 'Từ chối' : 'Chờ duyệt'}
                              </span>
                              {l.status === 'PENDING' && (
                                <button
                                  onClick={() => handleCancelLeave(l.id)}
                                  className="px-2 py-0.5 text-xs text-slate-500 hover:text-red-600 font-medium cursor-pointer"
                                >
                                  Rút đơn
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* TAB 5: HỌC PHÍ & VIETQR */}
              {currentTab === 'fees' && (
                <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-4">
                  <div className="pb-3 border-b border-slate-100">
                    <h2 className="text-base font-bold text-slate-900">Học phí & Thanh toán VietQR</h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Quét mã QR bằng ứng dụng ngân hàng để điền sẵn số tiền và nội dung nộp học phí.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
                    <div className="md:col-span-7 space-y-3 text-[13px]">
                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                        <div className="flex justify-between">
                          <span className="text-slate-500">Mã sinh viên</span>
                          <strong className="text-slate-900 font-mono">{currentStudent.student_code}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Họ và tên</span>
                          <strong className="text-slate-900">{currentStudent.full_name}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Đợt thu</span>
                          <strong className="text-slate-900">{dbData?.tuition?.semester || 'Học kỳ I (2026 - 2027)'}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Tài khoản thụ hưởng</span>
                          <strong className="text-slate-900">MB Bank • 0902000001</strong>
                        </div>
                        <div className="flex justify-between pt-2.5 border-t border-slate-200 text-sm">
                          <span className="font-semibold text-slate-800">Tổng học phí cần nộp</span>
                          <strong className="text-brand-600 text-base tabular-nums">{tuitionAmount.toLocaleString('vi-VN')} VNĐ</strong>
                        </div>
                      </div>

                      <div className="p-3.5 rounded-xl bg-blue-50/70 border border-blue-200 flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="text-[11px] text-slate-500 font-medium">Nội dung chuyển khoản</div>
                          <div className="font-mono text-xs font-semibold text-slate-900 truncate mt-0.5">{transferNote}</div>
                        </div>
                        <button
                          onClick={() => handleCopyTransferInfo(transferNote)}
                          className="px-3 py-1.5 bg-white border border-blue-200 hover:border-brand-600 text-brand-600 text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shrink-0 cursor-pointer"
                        >
                          <Icon name="copy" className="w-3.5 h-3.5" />
                          <span>Sao chép</span>
                        </button>
                      </div>

                      <p className="text-xs text-slate-500 leading-relaxed">
                        Lưu ý: Giữ đúng cú pháp mã sinh viên trong nội dung chuyển khoản để phòng Tài vụ tự động đối soát gạch nợ.
                      </p>
                    </div>

                    <div className="md:col-span-5 flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                      {!qrBroken ? (
                        <img
                          src={`https://api.vietqr.io/image/970422-0902000001-compact2.jpg?amount=${tuitionAmount}&addInfo=${encodeURIComponent(transferNote)}&accountName=TRUONG%20CAO%20DANG%20CONG%20NGHIEP%20HUE`}
                          alt="Mã VietQR nộp học phí"
                          onError={() => setQrBroken(true)}
                          className="w-48 h-48 rounded-lg border border-slate-200 bg-white object-contain p-1.5"
                        />
                      ) : (
                        <div className="w-48 h-48 rounded-lg border border-dashed border-slate-300 bg-white flex items-center justify-center p-4 text-xs text-slate-400">
                          Không tải được mã QR (kiểm tra kết nối mạng). Vui lòng chuyển khoản thủ công theo thông tin bên trái.
                        </div>
                      )}
                      <p className="text-xs font-semibold text-slate-800 mt-3">TRƯỜNG CĐ CÔNG NGHIỆP HUẾ</p>
                      <span className="text-[11px] text-slate-500">Ngân hàng TMCP Quân đội (MB Bank)</span>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 6: TÀI LIỆU & FLASHCARD */}
              {currentTab === 'lectures' && (
                <div className="space-y-4">
                  <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-4">
                    <div>
                      <h2 className="text-base font-bold text-slate-900">Tài liệu môn học & Flashcard ôn tập</h2>
                      <p className="text-xs text-slate-500 mt-0.5">Chọn học phần để xem đề cương chương và lật thẻ ôn nhanh kiến thức trọng tâm.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                      {LECTURE_MODULES.map((m, idx) => {
                        const selected = idx === activeModuleIdx;
                        return (
                          <button
                            key={m.code}
                            onClick={() => handleSelectModule(idx)}
                            className={`p-3 rounded-xl border text-left transition cursor-pointer ${
                              selected
                                ? 'bg-blue-50 border-brand-600 shadow-sm'
                                : 'bg-slate-50/70 border-slate-200 hover:bg-white'
                            }`}
                          >
                            <span className="text-[11px] font-mono font-semibold text-brand-600">{m.code}</span>
                            <div className="text-xs font-semibold text-slate-900 mt-1 line-clamp-2">{m.title}</div>
                          </button>
                        );
                      })}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-12 gap-4 pt-2">
                      {/* Danh mục bài học */}
                      <div className="md:col-span-6 p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-2.5">
                        <h3 className="text-xs font-semibold uppercase tracking-wide text-slate-500">
                          Nội dung chính ({activeModule.chapters.length} chương)
                        </h3>
                        <ul className="space-y-2 text-[13px] text-slate-700">
                          {activeModule.chapters.map((ch, i) => (
                            <li key={i} className="flex items-start gap-2.5 bg-white p-2.5 rounded-lg border border-slate-200/80">
                              <span className="w-5 h-5 rounded-full bg-blue-50 text-brand-600 text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5">
                                {i + 1}
                              </span>
                              <span>{ch}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      {/* Flashcard tương tác thật */}
                      <div className="md:col-span-6 flex flex-col justify-between p-4 rounded-xl border border-slate-200 bg-white space-y-3">
                        <div className="flex items-center justify-between text-xs">
                          <span className="font-semibold text-slate-700">Flashcard ôn nhanh</span>
                          <span className="text-slate-400">Thẻ {cardIdx + 1}/{activeModule.cards.length}</span>
                        </div>

                        <button
                          type="button"
                          onClick={() => setCardFlipped(f => !f)}
                          className={`min-h-[160px] w-full p-5 rounded-xl border-2 text-left flex flex-col justify-between transition cursor-pointer ${
                            cardFlipped
                              ? 'bg-emerald-50/70 border-emerald-300'
                              : 'bg-blue-50/60 border-blue-200 hover:border-brand-600'
                          }`}
                        >
                          <span className={`text-[11px] font-semibold uppercase tracking-wide ${cardFlipped ? 'text-emerald-700' : 'text-brand-600'}`}>
                            {cardFlipped ? 'Đáp án / Gợi nhớ' : 'Câu hỏi'}
                          </span>
                          <p className="text-sm font-medium text-slate-900 leading-relaxed my-2">
                            {cardFlipped ? activeCard.back : activeCard.front}
                          </p>
                          <span className="text-[11px] text-slate-400">
                            Nhấn vào thẻ để {cardFlipped ? 'xem lại câu hỏi' : 'lật xem đáp án'}
                          </span>
                        </button>

                        <div className="flex items-center justify-between gap-2">
                          <button
                            onClick={() => {
                              setCardIdx(prev => (prev - 1 + activeModule.cards.length) % activeModule.cards.length);
                              setCardFlipped(false);
                            }}
                            className="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-medium text-slate-700 cursor-pointer"
                          >
                            ← Thẻ trước
                          </button>
                          <button
                            onClick={() => setCardFlipped(f => !f)}
                            className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 cursor-pointer"
                          >
                            Lật thẻ
                          </button>
                          <button
                            onClick={() => {
                              setCardIdx(prev => (prev + 1) % activeModule.cards.length);
                              setCardFlipped(false);
                            }}
                            className="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-medium text-slate-700 cursor-pointer"
                          >
                            Thẻ sau →
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 7: LUYỆN THI TRẮC NGHIỆM */}
              {currentTab === 'assessment' && (
                <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3.5 border-b border-slate-200 gap-3">
                    <div>
                      <h2 className="text-base font-bold text-slate-900">Luyện tập trắc nghiệm CNTT</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        {quizSubmitted
                          ? `Kết quả: đúng ${quizCorrectCount}/${QUIZ_BANK.length} câu (${Math.round((quizCorrectCount / QUIZ_BANK.length) * 100)}%). Xem giải thích bên dưới.`
                          : `Đã chọn ${answeredCount}/${QUIZ_BANK.length} câu hỏi.`}
                      </p>
                    </div>
                    {!quizSubmitted ? (
                      <button
                        onClick={handleQuizSubmit}
                        className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-lg shadow-sm transition self-start sm:self-center cursor-pointer"
                      >
                        Nộp bài & Chấm điểm
                      </button>
                    ) : (
                      <button
                        onClick={() => { setQuizSubmitted(false); setQuizAnswers({}); }}
                        className="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 text-xs font-semibold rounded-lg transition self-start sm:self-center cursor-pointer"
                      >
                        Làm lại từ đầu
                      </button>
                    )}
                  </div>

                  <div className="space-y-4">
                    {QUIZ_BANK.map((q, idx) => {
                      const chosen = quizAnswers[q.id];
                      return (
                        <div key={q.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/60 space-y-3">
                          <div className="flex items-start justify-between gap-2">
                            <p className="font-semibold text-[13px] text-slate-900 leading-relaxed">
                              Câu {idx + 1}. {q.question}
                            </p>
                            <span className="text-[11px] bg-white border border-slate-200 text-slate-500 px-2 py-0.5 rounded shrink-0">
                              {q.subject}
                            </span>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[13px]">
                            {q.options.map((opt, oIdx) => {
                              const isChosen = chosen === oIdx;
                              let style = 'bg-white border-slate-200 text-slate-700 hover:border-slate-300';
                              if (quizSubmitted) {
                                if (oIdx === q.answer) style = 'bg-emerald-50 border-emerald-400 text-emerald-800 font-semibold';
                                else if (isChosen) style = 'bg-red-50 border-red-300 text-red-700';
                              } else if (isChosen) {
                                style = 'bg-blue-50 border-brand-600 text-brand-700 font-semibold';
                              }
                              return (
                                <button
                                  key={oIdx}
                                  type="button"
                                  disabled={quizSubmitted}
                                  onClick={() => setQuizAnswers(prev => ({ ...prev, [q.id]: oIdx }))}
                                  className={`p-2.5 rounded-lg border text-left transition cursor-pointer ${style}`}
                                >
                                  <span className="font-mono text-xs mr-1.5 opacity-70">{String.fromCharCode(65 + oIdx)}.</span>
                                  {opt}
                                </button>
                              );
                            })}
                          </div>

                          {quizSubmitted && (
                            <div className="p-3 rounded-lg bg-white border border-slate-200 text-xs text-slate-600 leading-relaxed">
                              <strong className={chosen === q.answer ? 'text-emerald-700' : 'text-amber-700'}>
                                {chosen === q.answer ? 'Chính xác: ' : 'Giải thích: '}
                              </strong>
                              {q.explanation}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TAB 8: HỎI ĐÁP HỌC VỤ */}
              {currentTab === 'assistant' && (
                <div className="bg-white rounded-xl border border-slate-200/90 shadow-sm flex flex-col h-[580px]">
                  <div className="px-4 py-3 border-b border-slate-200 flex items-center justify-between bg-white rounded-t-xl">
                    <div>
                      <h2 className="font-semibold text-sm text-slate-900">Hỏi đáp học vụ nhanh</h2>
                      <p className="text-xs text-slate-500">Tra cứu trực tiếp từ dữ liệu điểm, chuyên cần và học phí của bạn</p>
                    </div>
                    <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium">
                      Sẵn sàng
                    </span>
                  </div>

                  <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scroll bg-[#F8FAFC]">
                    {chatMessages.map(m => {
                      const isUser = m.sender === 'user';
                      return (
                        <div key={m.id} className={`flex ${isUser ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[82%] px-3.5 py-2.5 rounded-2xl text-[13px] leading-relaxed ${
                            isUser
                              ? 'bg-brand-600 text-white rounded-br-sm shadow-sm'
                              : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm shadow-sm'
                          }`}>
                            {m.text}
                          </div>
                        </div>
                      );
                    })}
                    {isTyping && (
                      <div className="text-xs text-slate-400">Đang tra cứu dữ liệu...</div>
                    )}
                    <div ref={chatBottomRef} />
                  </div>

                  <div className="p-3 border-t border-slate-200 bg-white rounded-b-xl space-y-2">
                    <div className="flex flex-wrap gap-1.5">
                      {[
                        'Điểm trung bình của mình bao nhiêu?',
                        'Kiểm tra chuyên cần',
                        'Trạng thái đơn nghỉ phép',
                        'Học phí kỳ này'
                      ].map((q, i) => (
                        <button
                          key={i}
                          type="button"
                          onClick={() => sendChatQuestion(q)}
                          className="text-[11px] px-2.5 py-1 rounded-full bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-brand-600 transition cursor-pointer"
                        >
                          {q}
                        </button>
                      ))}
                    </div>

                    <form
                      onSubmit={e => {
                        e.preventDefault();
                        sendChatQuestion(chatInput);
                      }}
                      className="flex gap-2"
                    >
                      <input
                        type="text"
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        placeholder="Nhập câu hỏi về điểm, chuyên cần, học phí..."
                        className="flex-1 px-3.5 py-2 rounded-lg border border-slate-300 text-[13px] text-slate-900 outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15"
                      />
                      <button
                        type="submit"
                        disabled={!chatInput.trim() || isTyping}
                        className="px-4 py-2 bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 text-white font-semibold text-xs rounded-lg shadow-sm transition flex items-center gap-1.5 cursor-pointer"
                      >
                        <Icon name="send" className="w-3.5 h-3.5" />
                        <span>Gửi</span>
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Thông báo nổi */}
          {toast && (
            <div
              role="status"
              className={`fixed bottom-5 right-5 z-50 px-4 py-3 bg-white rounded-xl shadow-lg border border-slate-200 border-l-4 max-w-sm ${
                toast.type === 'error'
                  ? 'border-l-red-600'
                  : toast.type === 'info'
                  ? 'border-l-brand-600'
                  : 'border-l-emerald-600'
              }`}
            >
              <div className="text-[13px] font-semibold text-slate-900">{toast.title}</div>
              <p className="text-xs text-slate-500 mt-0.5">{toast.message}</p>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-400 mt-auto">
            © 2026 Trường Cao đẳng Công nghiệp Huế (HueIC) — Cổng thông tin Sinh viên • SchoolPulse
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentApp />);
  </script>
</body>
</html>
