    function getTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().split('T')[0];
    }

    function formatDateVN(isoDate) {
      if (!isoDate) return '—';
      const parts = String(isoDate).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : isoDate;
    }

    function getVnInitials(fullName) {
      if (!fullName) return 'PH';
      const cleaned = fullName.replace(/^(Bác|Anh|Chị|Ông|Bà|Thầy|Cô|ThS\.|TS\.|GV\.)\s*/i, '').trim();
      const words = cleaned.split(/\s+/).filter(Boolean);
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[words.length - 2][0] + words[words.length - 1][0]).toUpperCase();
    }

    function isValidScore(v) {
      return v !== '' && v !== null && v !== undefined && !Number.isNaN(Number(v));
    }

    function formatScore(v) {
      return isValidScore(v) ? Number(v).toFixed(1) : '—';
    }

    function calcSubjectAvg(g) {
      if (!g) return null;
      const mid = isValidScore(g.midterm) ? g.midterm : g.period;
      if (![g.oral, g.quiz, mid, g.final].every(isValidScore)) return null;
      const val = Number(g.oral) * 0.1 + Number(g.quiz) * 0.2 + Number(mid) * 0.2 + Number(g.final) * 0.5;
      return Math.round(val * 10) / 10;
    }

    function getRankInfo(avg) {
      if (avg === null || Number.isNaN(avg)) {
        return { letter: '—', name: 'Chưa đủ điểm', remark: 'Đang chờ cập nhật đủ điểm thành phần', badge: 'bg-slate-100 text-slate-500 border-slate-200' };
      }
      if (avg >= 8.5) {
        return { letter: 'A', name: 'Giỏi', remark: 'Tiếp thu tốt, chủ động làm bài thực hành', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
      }
      if (avg >= 7.0) {
        return { letter: 'B', name: 'Khá', remark: 'Nắm vững kiến thức cơ bản, đi học đều', badge: 'bg-blue-50 text-blue-700 border-blue-200' };
      }
      if (avg >= 5.5) {
        return { letter: 'C', name: 'Trung bình', remark: 'Đạt yêu cầu, cần rèn thêm bài tập thực hành', badge: 'bg-amber-50 text-amber-700 border-amber-200' };
      }
      if (avg >= 4.0) {
        return { letter: 'D', name: 'TB yếu', remark: 'Cần gia đình đôn đốc ôn tập kỹ hơn', badge: 'bg-orange-50 text-orange-700 border-orange-200' };
      }
      return { letter: 'F', name: 'Học lại', remark: 'Chưa đạt yêu cầu học phần, cần đăng ký học cải thiện', badge: 'bg-red-50 text-red-700 border-red-200' };
    }

    function getAttendanceMeta(status) {
      switch (status) {
        case 'PRESENT':
          return { label: 'Có mặt', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
        case 'LATE':
          return { label: 'Đi trễ', cls: 'bg-purple-50 text-purple-700 border-purple-200' };
        case 'EXCUSED':
          return { label: 'Có phép', cls: 'bg-amber-50 text-amber-700 border-amber-200' };
        default:
          return { label: 'Không phép', cls: 'bg-red-50 text-red-700 border-red-200' };
      }
    }

    function getStoredDb() {
      const saved = localStorage.getItem('sll_local_db');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.students)) {
            if (typeof window !== 'undefined' && window.INITIAL_DB && Array.isArray(window.INITIAL_DB.students) && parsed.students.length < window.INITIAL_DB.students.length) {
              try { localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB)); } catch (e) {}
              return window.INITIAL_DB;
            }
            return parsed;
          }
        } catch (e) {}
      }
      if (typeof window !== 'undefined' && window.INITIAL_DB) {
        try {
          localStorage.setItem('sll_local_db', JSON.stringify(window.INITIAL_DB));
        } catch (e) {}
        return window.INITIAL_DB;
      }
      try {
        localStorage.setItem('sll_local_db', JSON.stringify(FALLBACK_DB));
      } catch (e) {}
      return FALLBACK_DB;
    }

    function ParentApp() {
      const [dbData, setDbData] = useState(() => getStoredDb());
      const [currentTab, setCurrentTab] = useState('grades');
      const [logoBroken, setLogoBroken] = useState(false);

      // Quản lý ID học sinh được chọn hoàn toàn động từ sessionStorage hoặc URL
      const [selectedStudentId, setSelectedStudentId] = useState(() => {
        const db = getStoredDb();
        const students = Array.isArray(db?.students) ? db.students : (FALLBACK_DB.students || []);

        try {
          const urlParams = new URLSearchParams(window.location.search);
          const urlCode = urlParams.get('student_code') || urlParams.get('code');
          if (urlCode) {
            const foundUrl = students.find(s => (s.student_code || '').toUpperCase() === urlCode.trim().toUpperCase());
            if (foundUrl) return foundUrl.id;
          }
        } catch (e) {}

        const scode = (sessionStorage.getItem('hueic_student_code') || '').trim().toUpperCase();
        if (scode) {
          const found = students.find(s => (s.student_code || '').toUpperCase() === scode);
          if (found) return found.id;
        }

        const sid = sessionStorage.getItem('current_student_id');
        if (sid) {
          const num = Number(sid);
          if (students.some(s => s.id === num)) return num;
        }

        return students[0]?.id || 1;
      });

      
      const [searchChildKeyword, setSearchChildKeyword] = useState('');
      const [selectedClassFilter, setSelectedClassFilter] = useState('ALL');

      const chatEndRef = useRef(null);

        setToast({ title, message, type });
        toastTimerRef.current = setTimeout(() => setToast(null), 3200);

            advisor_phone: advisorPhone,
            advisor_email: advisorEmail
          }
        };

        reason: ''
      }));

      // Đồng bộ realtime giữa các tab trình duyệt
      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === 'sll_local_db' && e.newValue) {
            try { setDbData(JSON.parse(e.newValue)); } catch (err) {}
          }
          if (e.key === 'sll_parent_chat' && e.newValue) {
            try { setChatMessages(JSON.parse(e.newValue)); } catch (err) {}
          }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      useEffect(() => {
        if (currentTab === 'messages') {
          chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, currentTab]);

      // Lọc hội thoại bảo mật chỉ của con em mình
      const visibleChat = useMemo(() => {
        const sid = currentParent.student.id;
        const filtered = chatMessages.filter(m => m.student_id === sid);
        if (filtered.length > 0) return filtered;
        return [
          {
            id: `welcome-${sid}`,
            student_id: sid,
            sender: 'teacher',
            text: `Kính chào quý phụ huynh em ${currentParent.student.full_name}! Tôi là ${advisorDisplayName} - Cố vấn học tập lớp ${currentParent.student.class_name}. Mọi vấn đề về học tập, rèn luyện hoặc đề xuất của gia đình xin gửi tin nhắn trực tiếp tại đây.`,
            time: '08:00 Hôm nay'
          }
        ];
      }, [chatMessages, currentParent.student.id, currentParent.student.full_name, currentParent.student.class_name, advisorDisplayName]);

      // Bảo mật điểm số: CHỈ hiển thị đúng điểm của con, không fallback làm lộ điểm học sinh khác
      const studentGrades = useMemo(() => {
        return (dbData?.grades || []).filter(g => g.student_id === currentParent.student.id);
      }, [dbData?.grades, currentParent.student.id]);

      const overallStats = useMemo(() => {
        const avgs = studentGrades.map(calcSubjectAvg).filter(v => v !== null);
        if (avgs.length === 0) return { avg: null, rank: getRankInfo(null), completed: 0 };
        const mean = Math.round((avgs.reduce((a, b) => a + b, 0) / avgs.length) * 10) / 10;
        return { avg: mean, rank: getRankInfo(mean), completed: avgs.length };
      }, [studentGrades]);

      // Bảo mật chuyên cần: CHỈ hiển thị đúng dữ liệu điểm danh của con
      const studentAttendance = useMemo(() => {
        const list = (dbData?.attendance || []).filter(a => a.student_id === currentParent.student.id);
        return [...list].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
      }, [dbData?.attendance, currentParent.student.id]);

      const attendanceStats = useMemo(() => {
        const counts = { PRESENT: 0, LATE: 0, EXCUSED: 0, UNEXCUSED: 0 };
        studentAttendance.forEach(a => {
          if (counts[a.status] !== undefined) counts[a.status]++;
        });
        const total = studentAttendance.length;
        const rate = total > 0 ? Math.round(((counts.PRESENT + counts.LATE) / total) * 100) : 100;
        return { ...counts, total, rate };
      }, [studentAttendance]);

      // Danh sách học sinh để đổi hồ sơ con
      const allStudents = useMemo(() => {
        return dbData?.students || FALLBACK_DB.students;
      }, [dbData?.students]);

      const filteredStudents = useMemo(() => {
        const kw = searchChildKeyword.trim().toLowerCase();
        return allStudents.filter(s => {
          const matchClass = selectedClassFilter === 'ALL' || s.class_name === selectedClassFilter;
          if (!matchClass) return false;
          if (!kw) return true;
          const nameMatch = (s.full_name || '').toLowerCase().includes(kw);
          const codeMatch = (s.student_code || '').toLowerCase().includes(kw);
          const parentMatch = (s.parent_name || '').toLowerCase().includes(kw);
          return nameMatch || codeMatch || parentMatch;
        });
      }, [allStudents, searchChildKeyword, selectedClassFilter]);

      const announcementsList = useMemo(() => {
        const list = dbData?.announcements;
        return Array.isArray(list) && list.length > 0 ? list : DEFAULT_ANNOUNCEMENTS;
      }, [dbData?.announcements]);

      const unreadAnnCount = useMemo(() => {
        return announcementsList.filter(a => !(a.read_by || []).includes(currentParent.id)).length;
      }, [announcementsList, currentParent.id]);

      const studentLeaves = useMemo(() => {
        return (dbData?.leaves || []).filter(l => l.student_id === currentParent.student.id);
      }, [dbData?.leaves, currentParent.student.id]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        const text = inputMessage.trim();
        if (!text) return;

        const newMsg = {
          id: Date.now(),
          student_id: currentParent.student.id,
          sender: 'parent',
          text,
          time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' Hôm nay'
        };

        const updated = [...chatMessages, newMsg];
        setChatMessages(updated);
        try {
          localStorage.setItem('sll_parent_chat', JSON.stringify(updated));
        } catch (err) {}
        setInputMessage('');
      };

      const handleMarkAsRead = (annId) => {
        const baseList = Array.isArray(dbData?.announcements) && dbData.announcements.length > 0
          ? dbData.announcements
          : DEFAULT_ANNOUNCEMENTS;

        const updatedAnn = baseList.map(a => {
          if (a.id === annId) {
            const readers = Array.isArray(a.read_by) ? a.read_by : [];
            return { ...a, read_by: [...new Set([...readers, currentParent.id])] };
          }
          return a;
        });

        persistDb({ ...FALLBACK_DB, ...dbData, announcements: updatedAnn });
        showToast('Đã xác nhận đọc', 'Nhà trường đã ghi nhận phụ huynh đã xem thông báo.', 'success');
      };

      const handleSendParentLeave = (e) => {
        e.preventDefault();
        if (!leaveForm.reason.trim()) {
          showToast('Thiếu thông tin', 'Vui lòng nhập lý do xin nghỉ phép cho con.', 'error');
          return;
        }
        if (leaveForm.endDate < leaveForm.startDate) {
          showToast('Ngày không hợp lệ', 'Ngày kết thúc không được trước ngày bắt đầu.', 'error');
          return;
        }

        const newLeave = {
          id: Date.now(),
          student_id: currentParent.student.id,
          student_name: currentParent.student.full_name,
          class_name: currentParent.student.class_name,
          start_date: leaveForm.startDate,
          end_date: leaveForm.endDate,
          reason: `[Phụ huynh gửi] ${leaveForm.reason.trim()}`,
          status: 'PENDING',
          created_at: new Date().toISOString()
        };

        persistDb({
          ...FALLBACK_DB,
          ...dbData,
          leaves: [newLeave, ...(dbData?.leaves || [])]

        setLeaveForm({ startDate: getTodayISO(), endDate: getTodayISO(), reason: '' });

      const handleCancelLeave = (leaveId) => {

        { id: 'attendance', label: 'Chuyên cần', icon: 'attendance' },
        { id: 'fees', label: 'Học phí & VietQR', icon: 'fees' },

                      )}

              </div>
            </div>
          </header>

          {/* Nội dung chính */}
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

              </div>

              {/* Thông tin sinh viên & GVCN */}
              <div className="bg-white rounded-xl border border-slate-200/90 p-4 shadow-sm space-y-3 text-xs">

                  <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Sinh viên</div>
                  <div className="font-semibold text-sm text-slate-900">{currentParent.student.full_name}</div>
                  <div className="text-slate-500 font-mono">{currentParent.student.student_code} • {currentParent.student.class_name}</div>
                </div>

                <div className="space-y-2">
                  <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Cố vấn học tập</div>
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-full bg-emerald-50 text-emerald-700 font-bold flex items-center justify-center border border-emerald-200 shrink-0">
                      {getVnInitials(currentParent.student.advisor_name)}
                    </div>
                    <div className="min-w-0">
                      <div className="font-semibold text-[13px] text-slate-800 truncate">{advisorDisplayName}</div>
                      <a

            {/* Khu vực làm việc */}
            <main className="lg:col-span-9 space-y-4">
              {/* TAB 1: ĐIỂM SỐ */}
              {currentTab === 'grades' && (

                      <h2 className="text-base font-bold text-slate-900">

                      </h2>

                        MSV: <span className="font-mono">{currentParent.student.student_code}</span> • Lớp {currentParent.student.class_name}
                      </p>

                    {studentGrades.length > 0 ? (
                      <span className={`px-3 py-1 rounded-full border text-xs font-semibold self-start sm:self-center ${overallStats.rank.badge}`}>

                      </span>

                      </span>

                  </div>

                  {studentGrades.length === 0 ? (
                    <div className="p-8 text-center bg-slate-50/70 border-b border-slate-200 space-y-3">
                      <div className="w-12 h-12 rounded-full bg-blue-50 text-brand-600 flex items-center justify-center mx-auto border border-blue-200 shadow-2xs">

                      <p className="text-xs text-slate-500 max-w-md mx-auto leading-relaxed">

                      </p>
                      <div className="pt-1">

                  ) : (

                    {visibleChat.length === 0 ? (
                      <div className="h-full flex items-center justify-center text-xs text-slate-400">
                        Chưa có tin nhắn nào. Phụ huynh có thể gửi lời nhắn cho cố vấn học tập bên dưới.
                      </div>
                    ) : (
                      visibleChat.map(m => {
                        const isParent = m.sender === 'parent';
                        return (
                          <div key={m.id} className={`flex ${isParent ? 'justify-end' : 'justify-start'}`}>
                            <div className={`max-w-[80%] px-3.5 py-2.5 rounded-2xl text-[13px] leading-relaxed shadow-sm ${
                              isParent
                                ? 'bg-brand-600 text-white rounded-br-sm'
                                : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'
                            }`}>
                              <p>{m.text}</p>
                              <span className={`block text-[10px] mt-1 text-right ${isParent ? 'text-blue-100' : 'text-slate-400'}`}>
                                {m.time}
                              </span>
                            </div>
                          </div>
                        );
                      })
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  <div className="p-3 border-t border-slate-200 bg-white rounded-b-xl space-y-2">
                    <div className="flex flex-wrap gap-1.5">
                      {quickMessages.map((txt, i) => (
                        <button
                          key={i}
                          type="button"
                          onClick={() => setInputMessage(txt)}
                          className="text-[11px] px-2.5 py-1 rounded-full bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-brand-600 transition truncate max-w-full cursor-pointer"
                        >
                          {txt}
                        </button>
                      ))}
                    </div>

                    <form onSubmit={handleSendMessage} className="flex gap-2">
                      <input
                        type="text"
                        value={inputMessage}
                        onChange={e => setInputMessage(e.target.value)}
                        placeholder={`Nhập tin nhắn gửi ${advisorDisplayName}...`}
                        className="flex-1 px-3.5 py-2 rounded-lg border border-slate-300 text-[13px] text-slate-900 outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15"
                      />
                      <button
                        type="submit"
                        disabled={!inputMessage.trim()}
                        className="px-4 py-2 bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 text-white font-semibold text-xs rounded-lg shadow-sm transition flex items-center gap-1.5 cursor-pointer"
                      >
                        <Icon name="send" className="w-3.5 h-3.5" />
                        <span>Gửi</span>
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* TAB 3: THÔNG BÁO NHÀ TRƯỜNG */}
              {currentTab === 'announcements' && (
                <div className="bg-white rounded-xl border border-slate-200/90 p-4 sm:p-5 shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3.5 border-b border-slate-200 gap-2">
                    <div>
                      <h2 className="text-base font-bold text-slate-900">Thông báo từ nhà trường</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Thông báo chính thức từ Ban Giám hiệu và Phòng Đào tạo HueIC.
                      </p>
                    </div>
                    <span className="text-xs font-semibold text-brand-600 bg-blue-50 px-2.5 py-1 rounded-full border border-blue-100 self-start sm:self-center">
                      {unreadAnnCount > 0 ? `${unreadAnnCount} chưa đọc` : 'Đã đọc tất cả'}
                    </span>
                  </div>

                  <div className="space-y-3">
                    {announcementsList.map(ann => {
                      const isRead = (ann.read_by || []).includes(currentParent.id);
                      const tagStyle = ann.tag === 'KHẨN CẤP'
                        ? 'bg-red-50 text-red-700 border-red-200'
                        : ann.tag === 'TÀI CHÍNH'
                        ? 'bg-amber-50 text-amber-700 border-amber-200'
                        : 'bg-blue-50 text-brand-600 border-blue-100';

                      return (
                        <div
                          key={ann.id}
                          className={`p-4 rounded-xl border transition ${
                            isRead ? 'border-slate-200 bg-white' : 'border-blue-200 bg-blue-50/30'
                          }`}
                        >
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                            <div className="flex flex-wrap items-center gap-2">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-semibold uppercase border ${tagStyle}`}>
                                {ann.tag || 'HỌC VỤ'}
                              </span>
                              <h3 className="font-semibold text-sm text-slate-900">{ann.title}</h3>
                            </div>
                            <span className="text-xs text-slate-400 font-mono tabular-nums shrink-0">
                              {formatDateVN(ann.created_at)}
                            </span>
                          </div>

                          <p className="text-[13px] text-slate-600 leading-relaxed mt-2">{ann.content}</p>

                          <div className="mt-3 pt-2.5 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                            <span className="text-slate-500">
                              Đơn vị ban hành: <strong className="text-slate-700 font-medium">{ann.author_name || 'Phòng Đào tạo'}</strong>
                            </span>
                            {isRead ? (
                              <span className="text-emerald-600 font-medium flex items-center gap-1">
                                <Icon name="check" className="w-3.5 h-3.5" />
                                <span>Đã xác nhận đọc</span>
                              </span>
                            ) : (
                              <button
                                onClick={() => handleMarkAsRead(ann.id)}
                                className="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs transition self-start sm:self-center cursor-pointer"
                              >
                                Xác nhận đã đọc
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TAB 4: CHUYÊN CẦN */}
              {currentTab === 'attendance' && (
                <div className="bg-white rounded-xl border border-slate-200/90 p-4 sm:p-5 shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3.5 border-b border-slate-200 gap-2">
                    <div>
                      <h2 className="text-base font-bold text-slate-900">Tình hình chuyên cần của con</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Tổng hợp trực tiếp từ sổ điểm danh của {advisorDisplayName}.
                      </p>
                    </div>
                    <span className="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold text-xs rounded-full self-start sm:self-center">
                      Tỷ lệ đi học: {attendanceStats.rate}%
                    </span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                    <div className="p-3.5 rounded-xl border border-slate-200 bg-slate-50/70">
                      <span className="text-xs text-slate-500">Có mặt</span>
                      <p className="text-xl font-bold text-emerald-600 tabular-nums mt-0.5">{attendanceStats.PRESENT}</p>
                    </div>
                    <div className="p-3.5 rounded-xl border border-slate-200 bg-slate-50/70">
                      <span className="text-xs text-slate-500">Đi trễ</span>
                      <p className="text-xl font-bold text-purple-600 tabular-nums mt-0.5">{attendanceStats.LATE}</p>
                    </div>
                    <div className="p-3.5 rounded-xl border border-slate-200 bg-slate-50/70">
                      <span className="text-xs text-slate-500">Nghỉ có phép</span>
                      <p className="text-xl font-bold text-amber-600 tabular-nums mt-0.5">{attendanceStats.EXCUSED}</p>
                    </div>
                    <div className="p-3.5 rounded-xl border border-slate-200 bg-slate-50/70">
                      <span className="text-xs text-slate-500">Không phép</span>
                      <p className="text-xl font-bold text-red-600 tabular-nums mt-0.5">{attendanceStats.UNEXCUSED}</p>
                    </div>
                  </div>

                  {studentAttendance.length === 0 ? (
                    <div className="p-8 text-center bg-slate-50/70 rounded-xl border border-dashed border-slate-300 space-y-3">
                      <div className="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto border border-emerald-200 shadow-2xs">
                        <Icon name="check" className="w-6 h-6" />
                      </div>
                      <h3 className="font-bold text-sm text-slate-800">
                        Chuyên cần đạt 100% — Chưa có ghi nhận vắng mặt
                      </h3>
                      <p className="text-xs text-slate-500 max-w-md mx-auto leading-relaxed">
                        Sinh viên {currentParent.student.full_name} ({currentParent.student.student_code} – {currentParent.student.class_name}) tham gia học tập đầy đủ và đúng giờ tại các buổi học trên lớp. Mọi ghi nhận điểm danh từ {advisorDisplayName} sẽ được cập nhật trực tiếp tại đây.
                      </p>
                    </div>
                  ) : (
                    <div>
                      <h3 className="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2.5">
                        Chi tiết các buổi đã ghi nhận ({studentAttendance.length} buổi)
                      </h3>
                      <div className="space-y-2">
                        {studentAttendance.map((att, idx) => {
                          const meta = getAttendanceMeta(att.status);
                          return (
                            <div key={att.id || idx} className="p-3 rounded-lg border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-slate-50/70 transition">
                              <div>
                                <div className="flex flex-wrap items-center gap-2 text-[13px]">
                                  <span className="font-semibold text-slate-900 tabular-nums">{formatDateVN(att.date)}</span>
                                  <span className="text-slate-300">•</span>
                                  <span className="text-slate-700 font-medium">{att.subject || 'Điểm danh lớp'}</span>
                                </div>
                                {att.note && <p className="text-xs text-slate-500 mt-0.5">{att.note}</p>}
                              </div>
                              <span className={`px-2.5 py-0.5 rounded-md text-xs font-semibold border self-start sm:self-center shrink-0 ${meta.cls}`}>
                                {meta.label}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 5: HỌC PHÍ & VIETQR */}
              {currentTab === 'fees' && (
                <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-4">
                  <div className="pb-3 border-b border-slate-100">
                    <h2 className="text-base font-bold text-slate-900">Đóng học phí qua VietQR</h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Mở ứng dụng ngân hàng bất kỳ và quét mã bên phải để điền tự động số tiền, nội dung nộp.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
                    <div className="md:col-span-7 space-y-3 text-[13px]">
                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                        <div className="flex justify-between">
                          <span className="text-slate-500">Sinh viên</span>
                          <strong className="text-slate-900">{currentParent.student.full_name}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Mã sinh viên</span>
                          <strong className="font-mono text-slate-900">{currentParent.student.student_code}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Đợt thu</span>
                          <strong className="text-slate-900">{dbData?.tuition?.semester || 'Học kỳ I (2026 – 2027)'}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Ngân hàng thụ hưởng</span>
                          <strong className="text-slate-900">MB Bank • 0902000001</strong>
                        </div>
                        <div className="flex justify-between pt-2.5 border-t border-slate-200 text-sm">
                          <span className="font-semibold text-slate-800">Số tiền cần nộp</span>
                          <strong className="text-brand-600 text-base tabular-nums">{tuitionAmount.toLocaleString('vi-VN')} VNĐ</strong>
                        </div>
                      </div>

                      <div className="p-3.5 rounded-xl bg-blue-50/70 border border-blue-200 flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="text-[11px] text-slate-500 font-medium">Nội dung chuyển khoản</div>
                          <div className="font-mono text-xs font-semibold text-slate-900 truncate mt-0.5">{transferNote}</div>
                        </div>
                        <button
                          onClick={() => handleCopyTransfer(transferNote)}
                          className="px-3 py-1.5 bg-white border border-blue-200 hover:border-brand-600 text-brand-600 text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shrink-0 cursor-pointer"
                        >
                          <Icon name="copy" className="w-3.5 h-3.5" />
                          <span>Sao chép</span>
                        </button>
                      </div>
                    </div>

                    <div className="md:col-span-5 flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                      {!qrBroken ? (
                        <img
                          src={`https://api.vietqr.io/image/970422-0902000001-compact2.jpg?amount=${tuitionAmount}&addInfo=${encodeURIComponent(transferNote)}&accountName=TRUONG%20CAO%20DANG%20CONG%20NGHIEP%20HUE`}
                          alt="Mã VietQR học phí"
                          onError={() => setQrBroken(true)}
                          className="w-48 h-48 rounded-lg border border-slate-200 bg-white object-contain p-1.5"
                        />
                      ) : (
                        <div className="w-48 h-48 rounded-lg border border-dashed border-slate-300 bg-white flex items-center justify-center p-4 text-xs text-slate-400">
                          Không tải được mã QR. Quý phụ huynh vui lòng chuyển khoản theo số tài khoản và nội dung bên trái.
                        </div>
                      )}
                      <p className="text-xs font-semibold text-slate-800 mt-3">TRƯỜNG CĐ CÔNG NGHIỆP HUẾ</p>
                      <span className="text-[11px] text-slate-500">Ngân hàng TMCP Quân đội (MB Bank)</span>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 6: XIN NGHỈ PHÉP */}
              {currentTab === 'leaves' && (
                <div className="space-y-4">
                  <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-4">
                    <div>
                      <h2 className="text-base font-bold text-slate-900">Gửi đơn xin nghỉ phép cho con</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Đơn gửi trực tiếp tới {advisorDisplayName} để phê duyệt và ghi nhận chuyên cần có phép.
                      </p>
                    </div>

                    <form onSubmit={handleSendParentLeave} className="space-y-3.5">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Từ ngày</label>
                          <input
                            type="date"
                            value={leaveForm.startDate}
                            onChange={e => setLeaveForm(prev => ({
                              ...prev,
                              startDate: e.target.value,
                              endDate: prev.endDate < e.target.value ? e.target.value : prev.endDate
                            }))}
                            className="w-full px-3 py-2 rounded-lg border border-slate-300 text-[13px] text-slate-800 outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Đến ngày</label>
                          <input
                            type="date"
                            min={leaveForm.startDate}
                            value={leaveForm.endDate}
                            onChange={e => setLeaveForm(prev => ({ ...prev, endDate: e.target.value }))}
                            className="w-full px-3 py-2 rounded-lg border border-slate-300 text-[13px] text-slate-800 outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15"
                            required
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Lý do xin nghỉ</label>
                        <textarea
                          rows="3"
                          value={leaveForm.reason}
                          onChange={e => setLeaveForm(prev => ({ ...prev, reason: e.target.value }))}
                          placeholder={`Ví dụ: Hôm nay cháu ${childFirstName} bị cảm sốt, gia đình xin phép cho cháu nghỉ 1 buổi...`}
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 text-[13px] text-slate-800 outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15"
                          required
                        />
                      </div>

                      <button
                        type="submit"
                        className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs transition shadow-sm cursor-pointer"
                      >
                        Gửi đơn cho cố vấn học tập
                      </button>
                    </form>
                  </div>

                  {/* Lịch sử đơn nghỉ phép */}
                  <div className="bg-white rounded-xl border border-slate-200/90 p-5 shadow-sm space-y-3">
                    <div className="flex items-center justify-between pb-2.5 border-b border-slate-100">
                      <h3 className="font-semibold text-sm text-slate-900">Lịch sử đơn đã gửi ({studentLeaves.length})</h3>
                      <span className="text-xs text-slate-400">Đồng bộ từ cổng giảng viên</span>
                    </div>

                    {studentLeaves.length === 0 ? (
                      <div className="py-6 text-center text-xs text-slate-400">
                        Chưa có đơn xin nghỉ phép nào được gửi.
                      </div>
                    ) : (
                      <div className="space-y-2.5">
                        {studentLeaves.map(l => (
                          <div key={l.id} className="p-3.5 rounded-lg border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                            <div className="space-y-0.5">
                              <div className="text-[13px] font-medium text-slate-900">{l.reason}</div>
                              <div className="text-xs text-slate-500">
                                Ngày nghỉ: <strong className="font-medium text-slate-700">{formatDateVN(l.start_date)}</strong>
                                {l.end_date && l.end_date !== l.start_date ? ` → ${formatDateVN(l.end_date)}` : ''}
                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <span className={`px-2.5 py-0.5 rounded-md text-xs font-semibold border ${
                                l.status === 'APPROVED'
                                  ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                  : l.status === 'REJECTED'
                                  ? 'bg-red-50 text-red-700 border-red-200'
                                  : 'bg-amber-50 text-amber-700 border-amber-200'
                              }`}>
                                {l.status === 'APPROVED' ? 'Đã duyệt' : l.status === 'REJECTED' ? 'Từ chối' : 'Chờ duyệt'}
                              </span>
                              {l.status === 'PENDING' && (
                                <button
                                  onClick={() => handleCancelLeave(l.id)}
                                  className="px-2 py-0.5 text-xs text-slate-500 hover:text-red-600 font-medium cursor-pointer"
                                >
                                  Rút đơn
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Thông báo nổi */}
          {toast && (
            <div
              role="status"
              className={`fixed bottom-5 right-5 z-50 px-4 py-3 bg-white rounded-xl shadow-lg border border-slate-200 border-l-4 max-w-sm ${
                toast.type === 'error'
                  ? 'border-l-red-600'
                  : toast.type === 'info'
                  ? 'border-l-brand-600'
                  : 'border-l-emerald-600'
              }`}
            >
              <div className="text-[13px] font-semibold text-slate-900">{toast.title}</div>
              <p className="text-xs text-slate-500 mt-0.5">{toast.message}</p>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-400 mt-auto">
            © 2026 Trường Cao đẳng Công nghiệp Huế (HueIC) — Cổng Sổ liên lạc Phụ huynh • SchoolPulse
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ParentApp />);
  </script>
</body>
</html>
